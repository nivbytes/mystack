<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useMemo, useRef, useCallback, useContext, createContext } = React;

/* ---------------------------------------------------------------------- */
/* Constants                                                                */
/* ---------------------------------------------------------------------- */

// 2xx responses slower than this are classified as "slow" (amber) rather than "fast" (green).
const SLOW_THRESHOLD_MS = 500;
// Different APIs report the model under different key names ("model", "GPTVersion",
// "gpt_version", "llm_model", ...), and the value may sit inside an escaped nested-JSON
// string (hence the optional backslashes around each quote).
const MODEL_REGEX = /\\*"(?:model|gptversion|gpt_version|modelversion|llm_model)\\*"\s*:\s*\\*"([^"\\]+)/i;
// Same escaped-quote tolerance as MODEL_REGEX, but global + "take the last match": a HAR
// capture of a streamed LLM response can contain several concatenated SSE/JSON chunks in
// content.text, and only the final chunk carries the finalized cumulative usage — the first
// match could be an early/incomplete number.
const TOKEN_REGEXES = {
  // Some APIs report "total_"-prefixed fields per call (alongside or instead of the plain
  // OpenAI/Anthropic-style names) — when present, these are treated as authoritative for that
  // call, same priority relationship as total_tokens already had over prompt+completion below.
  promptPreferred: /\\*"total_prompt_tokens\\*"\s*:\s*\\*"?(\d+)/gi,
  prompt: /\\*"(?:prompt_tokens|input_tokens)\\*"\s*:\s*\\*"?(\d+)/gi,
  completionPreferred: /\\*"total_completion_tokens\\*"\s*:\s*\\*"?(\d+)/gi,
  completion: /\\*"(?:completion_tokens|output_tokens)\\*"\s*:\s*\\*"?(\d+)/gi,
  total: /\\*"(?:total_tokens)\\*"\s*:\s*\\*"?(\d+)/gi,
};
// Seed rates in $ per 1,000 tokens — estimates the user can edit/override via the Pricing
// modal; matched against a model name by longest-substring match (see matchPricing).
const DEFAULT_PRICING = {
  'gpt-4o-mini': { in: 0.15, out: 0.6 },
  'gpt-4o': { in: 2.5, out: 10 },
  'gpt-4-turbo': { in: 10, out: 30 },
  'gpt-4': { in: 30, out: 60 },
  'gpt-3.5-turbo': { in: 0.5, out: 1.5 },
  'claude-3-5-sonnet': { in: 3, out: 15 },
  'claude-3-opus': { in: 15, out: 75 },
  'claude-3-sonnet': { in: 3, out: 15 },
  'claude-3-haiku': { in: 0.25, out: 1.25 },
};
const TYPE_OPTIONS = ['All', 'JS', 'CSS', 'Image', 'Font', 'XHR/Fetch', 'Preflight'];
const ROW_H = 44;
const DETAIL_H = 440;

const TYPE_ICON_CLASS = {
  'JS': 'bg-[#FDF0D6] text-[#A66A0D]',
  'CSS': 'bg-blue-bg text-blue',
  'Image': 'bg-green-bg text-green',
  'Font': 'bg-[#FBE7F3] text-[#B23E86]',
  'XHR/Fetch': 'bg-[#F1E7FB] text-[#7A3FC4]',
  'Document': 'bg-amber-bg text-amber',
  'Preflight': 'bg-[#DBF5F2] text-[#1A8F86]',
  'Other': 'bg-line text-ink-soft',
};

/* ---------------------------------------------------------------------- */
/* Settings context (time unit + timezone, shared across the tree)         */
/* ---------------------------------------------------------------------- */

const SettingsContext = createContext({ timeUnit: 's', timezone: 'GMT', theme: 'light' });
function useSettings() { return useContext(SettingsContext); }

/* ---------------------------------------------------------------------- */
/* Helpers                                                                  */
/* ---------------------------------------------------------------------- */

function formatDuration(ms, unit) {
  if (ms == null || isNaN(ms)) return '–';
  ms = Math.max(0, ms);
  if (unit === 's') return (ms / 1000).toFixed(1) + ' s';
  if (unit === 'minsec') {
    const totalSec = ms / 1000;
    const mins = Math.floor(totalSec / 60);
    const secs = Math.round(totalSec - mins * 60);
    return mins > 0 ? `${mins} min ${secs} s` : `${secs} s`;
  }
  return Math.round(ms) + ' ms';
}

// Decimal (1000-based) units, matching Chrome DevTools' own Network panel Size column —
// not binary/1024-based KiB/MiB. 2,351,138 bytes reads as 2.35mb there, not 2.24mb.
function formatBytes(bytes) {
  if (!bytes || bytes <= 0) return '0b';
  if (bytes < 1000) return Math.round(bytes) + 'b';
  if (bytes < 1000 * 1000) return (bytes / 1000).toFixed(1) + 'kb';
  return (bytes / 1000 / 1000).toFixed(2) + 'mb';
}

const _tsFormatters = {};
function getTsFormatter(timezone) {
  const tz = timezone === 'IST' ? 'Asia/Kolkata' : 'UTC';
  if (!_tsFormatters[tz]) {
    _tsFormatters[tz] = new Intl.DateTimeFormat('en-GB', {
      timeZone: tz, hour: '2-digit', minute: '2-digit', second: '2-digit', fractionalSecondDigits: 3, hour12: false,
    });
  }
  return _tsFormatters[tz];
}
function formatTimestamp(ms, timezone) {
  if (!ms) return '–';
  return getTsFormatter(timezone).format(new Date(ms));
}

// Status-only color, ignoring duration — used where a single status VALUE represents a group
// of entries with varying durations (e.g. the Status filter popover's swatches).
function pureStatusColor(status) {
  if (!status || status >= 400) return 'red';
  if (status >= 300) return 'amber';
  return 'green';
}

// Full classification per spec: red = failed (4xx/5xx or no response), amber = redirect (3xx)
// OR a slow 2xx (> thresholdMs), green = fast 2xx. thresholdMs defaults to the global
// SLOW_THRESHOLD_MS but callers may pass a per-API override (Simple mode's custom thresholds).
function statusColor(status, time, thresholdMs) {
  if (!status || status >= 400) return 'red';
  if (status >= 300) return 'amber';
  const limit = typeof thresholdMs === 'number' ? thresholdMs : SLOW_THRESHOLD_MS;
  if (typeof time === 'number' && time > limit) return 'amber';
  return 'green';
}

// A request is a CORS preflight if it's an OPTIONS call carrying the standard
// Access-Control-Request-* headers. If headers weren't captured at all, fall back to
// method alone — an OPTIONS call is a preflight in the overwhelming majority of real traffic.
function isPreflightRequest(method, headers) {
  if (method !== 'OPTIONS') return false;
  if (headers && headers.length) {
    return headers.some(h => /^access-control-request-/i.test(h.name || ''));
  }
  return true;
}

function classify(mimeType, url, method, headers) {
  if (isPreflightRequest(method, headers)) return 'Preflight';
  const m = (mimeType || '').toLowerCase();
  const u = (url || '').toLowerCase().split('?')[0];
  if (m.includes('javascript') || u.endsWith('.js')) return 'JS';
  if (m.includes('css') || u.endsWith('.css')) return 'CSS';
  if (m.startsWith('image/') || /\.(png|jpe?g|gif|svg|webp|ico|avif)$/.test(u)) return 'Image';
  if (m.includes('font') || /\.(woff2?|ttf|otf|eot)$/.test(u)) return 'Font';
  if (m.includes('html')) return 'Document';
  if (m.includes('json') || m.includes('xml') || u.includes('/api/') ||
      method === 'POST' || method === 'PUT' || method === 'DELETE' || method === 'PATCH') return 'XHR/Fetch';
  return 'Other';
}

// Bytes actually transferred over the wire. HAR marks bodySize/headersSize as -1 when the
// capturing tool didn't track them (common outside Chrome DevTools' own exporter) — fall back
// to the uncompressed content size in that case rather than silently reporting 0.
function transferredSize(res) {
  const bs = res.bodySize;
  const hs = res.headersSize;
  if (typeof bs === 'number' && bs >= 0 && typeof hs === 'number' && hs >= 0) {
    return bs + hs;
  }
  // Chrome's own HAR export (and several proxy/capture tools) additionally stamp a
  // nonstandard `_transferSize` on the response — the same authoritative wire-bytes figure
  // DevTools' own Size column uses — when bodySize/headersSize weren't tracked. Prefer that
  // over the uncompressed content.size before giving up entirely.
  if (typeof res._transferSize === 'number' && res._transferSize >= 0) {
    return res._transferSize;
  }
  return (res.content && res.content.size >= 0) ? res.content.size : 0;
}

function extractModel(req, res) {
  const respText = res.content && res.content.text;
  if (respText) {
    const m = MODEL_REGEX.exec(respText);
    if (m) return m[1];
  }
  const reqText = req.postData && req.postData.text;
  if (reqText) {
    const m = MODEL_REGEX.exec(reqText);
    if (m) return m[1];
  }
  return null;
}

// Runs a global regex to completion and returns the LAST captured number (see TOKEN_REGEXES
// comment for why "last" instead of "first" matters for streamed responses).
function lastRegexMatchNumber(regex, text) {
  regex.lastIndex = 0;
  let m, last = null;
  while ((m = regex.exec(text)) !== null) {
    last = Number(m[1]);
    if (m.index === regex.lastIndex) regex.lastIndex++;
  }
  return last;
}

function extractTokenUsage(req, res) {
  const respText = res.content && res.content.text;
  const reqText = req.postData && req.postData.text;
  function pick(regex) {
    if (respText) { const v = lastRegexMatchNumber(regex, respText); if (v != null) return v; }
    if (reqText) { const v = lastRegexMatchNumber(regex, reqText); if (v != null) return v; }
    return null;
  }
  const promptTokens = pick(TOKEN_REGEXES.promptPreferred) ?? pick(TOKEN_REGEXES.prompt);
  const completionTokens = pick(TOKEN_REGEXES.completionPreferred) ?? pick(TOKEN_REGEXES.completion);
  let totalTokens = pick(TOKEN_REGEXES.total);
  if (totalTokens == null && (promptTokens != null || completionTokens != null)) {
    totalTokens = (promptTokens || 0) + (completionTokens || 0);
  }
  return { promptTokens, completionTokens, totalTokens };
}

function normalizeEntry(e, idx, pageStart) {
  const req = e.request || {};
  const res = e.response || {};
  const url = req.url || '';
  let hostname = '', pathname = url;
  try {
    const u = new URL(url);
    hostname = u.hostname;
    pathname = u.pathname + u.search;
  } catch (err) { /* relative/opaque URL, keep raw */ }
  const segments = pathname.split('/').filter(Boolean);
  const name = segments.length ? segments[segments.length - 1] : (pathname || url || '(root)');
  const status = res.status || 0;
  const mimeType = (res.content && res.content.mimeType) || '';
  const type = classify(mimeType, url, req.method, req.headers);
  const size = transferredSize(res);
  const contentSize = (res.content && res.content.size >= 0) ? res.content.size : 0;
  const time = typeof e.time === 'number' ? e.time : 0;
  const timings = e.timings || {};
  const dns = Math.max(timings.dns || 0, 0);
  const connect = Math.max(timings.connect || 0, 0) + Math.max(timings.ssl || 0, 0);
  const wait = Math.max(timings.wait || 0, 0);
  const download = Math.max(timings.receive || 0, 0);
  const send = Math.max(timings.send || 0, 0);
  const startedDateTime = e.startedDateTime ? new Date(e.startedDateTime).getTime() : pageStart;
  const endTime = startedDateTime + time;
  const method = req.method || 'GET';
  const failed = status === 0 || status >= 400;
  return {
    id: idx, url, name: name || url, domain: hostname || '(unknown host)',
    method, status, statusText: res.statusText || '',
    mimeType, type, size, contentSize, time, dns, connect, wait, download, send,
    startedDateTime, endTime, failed,
    model: extractModel(req, res),
    tokenUsage: extractTokenUsage(req, res),
    requestHeaders: req.headers || [], responseHeaders: res.headers || [],
    postData: req.postData || null, content: res.content || null,
    raw: e,
  };
}

function computeMeta(entries) {
  const totalRequests = entries.length;
  const failedCount = entries.filter(e => e.failed).length;
  let totalSize = 0, totalContentSize = 0, minStart = Infinity, maxEnd = -Infinity;
  let heaviest = null, fastest = null, slowest = null;
  entries.forEach(e => {
    totalSize += e.size;
    totalContentSize += e.contentSize;
    if (e.startedDateTime < minStart) minStart = e.startedDateTime;
    if (e.endTime > maxEnd) maxEnd = e.endTime;
    if (!heaviest || e.size > heaviest.size) heaviest = e;
    if (e.time > 0 && (!fastest || e.time < fastest.time)) fastest = e;
    if (!slowest || e.time > slowest.time) slowest = e;
  });
  const totalLoadTime = totalRequests ? Math.max(0, maxEnd - minStart) : 0;
  return { totalRequests, failedCount, totalSize, totalContentSize, totalLoadTime, heaviest, fastest, slowest };
}

// Case-insensitive substring match against a model name, longest key wins — so a table
// containing both "gpt-4" and "gpt-4o" rows still matches "gpt-4o-2024-08-06" to the more
// specific "gpt-4o" rate rather than whichever key happened to be checked first.
function matchPricing(model, table) {
  if (!model) return null;
  const m = model.toLowerCase();
  let best = null;
  Object.keys(table).forEach(key => {
    if (m.includes(key.toLowerCase()) && (!best || key.length > best.length)) best = key;
  });
  return best ? table[best] : null;
}

// Only entries that actually carry a model name or token counts are aggregated — the
// overwhelming majority of HAR files (no LLM traffic) end up with an empty rows array, which
// LlmInsightsPanel uses to render nothing rather than an empty/placeholder section.
function computeLlmStats(entries, pricingTable) {
  const byModel = new Map();
  entries.forEach(e => {
    if (!e.model && !e.tokenUsage.promptTokens && !e.tokenUsage.completionTokens) return;
    const key = e.model || '(unknown model)';
    const cur = byModel.get(key) || { model: key, calls: 0, promptTokens: 0, completionTokens: 0, cost: 0, hasCost: false };
    cur.calls += 1;
    cur.promptTokens += e.tokenUsage.promptTokens || 0;
    cur.completionTokens += e.tokenUsage.completionTokens || 0;
    const price = matchPricing(e.model, pricingTable);
    if (price) {
      cur.cost += ((e.tokenUsage.promptTokens || 0) / 1000) * price.in + ((e.tokenUsage.completionTokens || 0) / 1000) * price.out;
      cur.hasCost = true;
    }
    byModel.set(key, cur);
  });
  const rows = [...byModel.values()].sort((a, b) => b.calls - a.calls);
  return { rows, hasAnyData: rows.length > 0 };
}

// Same per-entry cost math as computeLlmStats (each entry is still costed against ITS OWN
// model's rate), but bucketed by API name instead of model — so an API called against several
// different models still gets one correct combined $ total (per-entry costing, summed), while
// `models` records which model(s) contributed for display (see LlmInsightsPanel's "Model(s)"
// column) rather than splitting the row into a per-model breakdown.
function computeLlmStatsByApi(entries, pricingTable) {
  const byApi = new Map();
  entries.forEach(e => {
    if (!e.model && !e.tokenUsage.promptTokens && !e.tokenUsage.completionTokens) return;
    const key = e.name;
    const cur = byApi.get(key) || { name: key, calls: 0, promptTokens: 0, completionTokens: 0, cost: 0, hasCost: false, models: new Set() };
    cur.calls += 1;
    cur.promptTokens += e.tokenUsage.promptTokens || 0;
    cur.completionTokens += e.tokenUsage.completionTokens || 0;
    if (e.model) cur.models.add(e.model);
    const price = matchPricing(e.model, pricingTable);
    if (price) {
      cur.cost += ((e.tokenUsage.promptTokens || 0) / 1000) * price.in + ((e.tokenUsage.completionTokens || 0) / 1000) * price.out;
      cur.hasCost = true;
    }
    byApi.set(key, cur);
  });
  const rows = [...byApi.values()].map(r => ({ ...r, models: [...r.models] })).sort((a, b) => b.calls - a.calls);
  return { rows, hasAnyData: rows.length > 0 };
}

// Case-insensitive header lookup — several insight rules below need this and no equivalent
// helper existed (existing code only ever did ad hoc header regex checks inline).
function findHeader(headers, name) {
  if (!headers) return null;
  const lower = name.toLowerCase();
  const h = headers.find(h => (h.name || '').toLowerCase() === lower);
  return h ? h.value : null;
}

const LARGE_PAYLOAD_BYTES = 1024 * 1024;
const CACHEABLE_TYPES = new Set(['JS', 'CSS', 'Image', 'Font']);
const COMPRESSIBLE_TYPES = new Set(['JS', 'CSS', 'XHR/Fetch', 'Document']);

// A lightweight "HAR linter" — pure findings computation, no state, always safe to re-run in a
// useMemo. Each rule pushes at most one finding (with a count + affected-entries list), never
// a finding per offending request, to keep the panel scannable.
function computeInsights(entries) {
  const findings = [];

  const dupMap = new Map();
  entries.forEach(e => {
    const key = e.method + ' ' + e.name;
    const list = dupMap.get(key) || [];
    list.push(e);
    dupMap.set(key, list);
  });
  const dupGroups = [...dupMap.values()].filter(list => list.length > 1);
  if (dupGroups.length) {
    findings.push({
      id: 'duplicates', severity: 'amber', title: 'Duplicate requests',
      description: `${dupGroups.length} distinct request${dupGroups.length !== 1 ? 's' : ''} (same method + name) ${dupGroups.length !== 1 ? 'were' : 'was'} called more than once — consider caching or de-duplicating.`,
      count: dupGroups.reduce((s, g) => s + g.length, 0),
      entries: dupGroups.flat(),
    });
  }

  const uncompressed = entries.filter(e =>
    COMPRESSIBLE_TYPES.has(e.type) && e.contentSize > 10 * 1024 &&
    !/^(gzip|br|deflate|zstd)/i.test(findHeader(e.responseHeaders, 'content-encoding') || '')
  );
  if (uncompressed.length) {
    findings.push({
      id: 'uncompressed', severity: 'amber', title: 'Uncompressed responses',
      description: `${uncompressed.length} response${uncompressed.length !== 1 ? 's' : ''} over 10kb ${uncompressed.length !== 1 ? 'are' : 'is'} served without gzip/br compression.`,
      count: uncompressed.length,
      entries: uncompressed,
    });
  }

  const uncached = entries.filter(e =>
    CACHEABLE_TYPES.has(e.type) &&
    !findHeader(e.responseHeaders, 'cache-control') && !findHeader(e.responseHeaders, 'expires')
  );
  if (uncached.length) {
    findings.push({
      id: 'uncached', severity: 'amber', title: 'Missing cache headers',
      description: `${uncached.length} static asset${uncached.length !== 1 ? 's' : ''} (JS/CSS/Image/Font) ${uncached.length !== 1 ? 'have' : 'has'} no Cache-Control or Expires header.`,
      count: uncached.length,
      entries: uncached,
    });
  }

  // Sorted largest-first: the description surfaces the actual largest size found, not just the
  // static threshold — otherwise "1 response over 1.05mb" reads like a measurement of the file
  // itself (it isn't; 1.05mb is only LARGE_PAYLOAD_BYTES re-expressed in decimal MB) and can
  // look like it disagrees with e.g. the Heaviest File stat card when it's actually consistent.
  const oversized = entries.filter(e => e.size > LARGE_PAYLOAD_BYTES).sort((a, b) => b.size - a.size);
  if (oversized.length) {
    findings.push({
      id: 'oversized', severity: 'amber', title: 'Oversized payloads',
      description: `${oversized.length} response${oversized.length !== 1 ? 's' : ''} over the ${formatBytes(LARGE_PAYLOAD_BYTES)} threshold — largest is ${formatBytes(oversized[0].size)}.`,
      count: oversized.length,
      entries: oversized,
    });
  }

  // Security headers only really mean anything on the page's own document response —
  // checking every sub-resource would be noise, and most captures won't have a Document
  // entry at all (XHR-only capture), in which case this rule silently contributes nothing.
  const doc = entries.find(e => e.type === 'Document');
  if (doc) {
    const missing = [];
    if (!findHeader(doc.responseHeaders, 'content-security-policy')) missing.push('Content-Security-Policy');
    if (!findHeader(doc.responseHeaders, 'strict-transport-security')) missing.push('Strict-Transport-Security');
    if (!findHeader(doc.responseHeaders, 'x-content-type-options')) missing.push('X-Content-Type-Options');
    if (missing.length) {
      findings.push({
        id: 'security-headers', severity: 'red', title: 'Missing security headers',
        description: `The main document response is missing: ${missing.join(', ')}.`,
        count: missing.length,
        entries: [doc],
      });
    }
  }

  return findings;
}

// Every entry in log.entries is counted, unconditionally — data URIs, cached 304s and OPTIONS
// preflights are never dropped. Any narrower "showing X of Y" count comes from active filters,
// applied later, never from parsing.
function parseHar(text) {
  let json;
  try {
    json = JSON.parse(text);
  } catch (err) {
    throw new Error("This file isn't valid JSON, so it can't be a HAR file.");
  }
  if (!json || typeof json !== 'object' || !json.log || !Array.isArray(json.log.entries)) {
    throw new Error("This JSON file doesn't look like a HAR export — it's missing the log.entries array.");
  }
  const rawEntries = json.log.entries;
  const pageStart = rawEntries.length ? new Date(rawEntries[0].startedDateTime).getTime() : Date.now();
  const entries = rawEntries.map((e, i) => normalizeEntry(e, i, pageStart));
  const page = json.log.pages && json.log.pages[0];
  const meta = computeMeta(entries);
  if (page && page.pageTimings && typeof page.pageTimings.onLoad === 'number' && page.pageTimings.onLoad > 0) {
    meta.totalLoadTime = page.pageTimings.onLoad;
  }
  return { entries, meta };
}

function prettyPrintMaybeJson(text) {
  if (!text) return '';
  try {
    return JSON.stringify(JSON.parse(text), null, 2);
  } catch (e) {
    return text;
  }
}

function highlightJsonTokens(prettyText) {
  const regex = /("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(\.\d+)?([eE][+-]?\d+)?)/g;
  const tokens = [];
  let lastIndex = 0, m;
  while ((m = regex.exec(prettyText)) !== null) {
    if (m.index > lastIndex) tokens.push({ text: prettyText.slice(lastIndex, m.index), cls: '' });
    const s = m[0];
    let cls = 'text-amber';
    if (/^"/.test(s)) cls = /:\s*$/.test(s) ? 'text-blue' : 'text-green';
    else if (/^(true|false|null)$/.test(s)) cls = 'text-red';
    tokens.push({ text: s, cls });
    lastIndex = regex.lastIndex;
  }
  if (lastIndex < prettyText.length) tokens.push({ text: prettyText.slice(lastIndex), cls: '' });
  return tokens;
}

function buildStatusOptions(entries) {
  const m = new Map();
  entries.forEach(e => m.set(e.status, (m.get(e.status) || 0) + 1));
  return [...m.entries()].sort((a, b) => a[0] - b[0]).map(([value, count]) => ({ value, count }));
}
const METHOD_ORDER = ['GET', 'POST', 'PUT', 'PATCH', 'DELETE', 'OPTIONS', 'HEAD'];
function buildMethodOptions(entries) {
  const m = new Map();
  entries.forEach(e => m.set(e.method, (m.get(e.method) || 0) + 1));
  const known = METHOD_ORDER.filter(o => m.has(o)).map(v => ({ value: v, count: m.get(v) }));
  const rest = [...m.keys()].filter(k => !METHOD_ORDER.includes(k)).sort().map(v => ({ value: v, count: m.get(v) }));
  return [...known, ...rest];
}
function buildModelOptions(entries) {
  const m = new Map();
  entries.forEach(e => { const v = e.model || '(none)'; m.set(v, (m.get(v) || 0) + 1); });
  return [...m.entries()].sort((a, b) => a[0].localeCompare(b[0])).map(([value, count]) => ({ value, count }));
}
function buildNameOptions(entries, sortMode) {
  const m = new Map();
  const order = [];
  entries.forEach(e => {
    if (!m.has(e.name)) { m.set(e.name, 0); order.push(e.name); }
    m.set(e.name, m.get(e.name) + 1);
  });
  const list = sortMode === 'az' ? [...order].sort((a, b) => a.localeCompare(b)) : order;
  return list.map(v => ({ value: v, count: m.get(v) }));
}

// The HAR file itself is never encoded here (client-only, no server, potentially huge) — this
// only restores a *view* (mode + filter selections) on top of a file the recipient must load
// themselves. Mismatched filters against a different file simply resolve to an empty list.
function encodeStateToHash(state) {
  try {
    const payload = {
      v: 1,
      mode: state.mode,
      simple: {
        selectedNames: [...state.simpleSelectedNames],
        colorFilter: [...state.colorFilter],
        thresholds: state.thresholds,
      },
      advanced: {
        search: state.advSearch,
        typeFilter: state.typeFilter,
        statusFilter: [...state.statusFilter],
        methodFilter: [...state.methodFilter],
        nameFilter: [...state.nameFilter],
        modelFilter: [...state.modelFilter],
        sortConfig: state.sortConfig,
      },
    };
    return encodeURIComponent(JSON.stringify(payload));
  } catch (err) {
    return '';
  }
}

function decodeStateFromHash(hash) {
  if (!hash) return null;
  try {
    const raw = hash.startsWith('#') ? hash.slice(1) : hash;
    if (!raw) return null;
    const payload = JSON.parse(decodeURIComponent(raw));
    if (!payload || payload.v !== 1) return null;
    return payload;
  } catch (err) {
    return null;
  }
}

function exportToExcel(rawEntries, meta, timeUnit, timezone, baseName) {
  const wb = XLSX.utils.book_new();

  const summaryRows = [
    ['Metric', 'Value'],
    ['Total requests', meta.totalRequests],
    ['Load time', formatDuration(meta.totalLoadTime, timeUnit)],
    ['Failed requests', meta.failedCount],
    ['Total transferred', formatBytes(meta.totalSize)],
    ['Heaviest file — name', meta.heaviest ? meta.heaviest.name : ''],
    ['Heaviest file — size', meta.heaviest ? formatBytes(meta.heaviest.size) : ''],
    ['Fastest file — name', meta.fastest ? meta.fastest.name : ''],
    ['Fastest file — time', meta.fastest ? formatDuration(meta.fastest.time, timeUnit) : ''],
    ['Slowest file — name', meta.slowest ? meta.slowest.name : ''],
    ['Slowest file — time', meta.slowest ? formatDuration(meta.slowest.time, timeUnit) : ''],
  ];
  const ws1 = XLSX.utils.aoa_to_sheet(summaryRows);
  XLSX.utils.book_append_sheet(wb, ws1, 'Simple Summary');

  const detailRows = [['Status', 'Method', 'Name', 'Model', 'Start Time', 'End Time', 'Time', 'Size']];
  rawEntries.forEach(e => {
    detailRows.push([
      e.status || 0, e.method, e.name, e.model || '-',
      formatTimestamp(e.startedDateTime, timezone), formatTimestamp(e.endTime, timezone),
      formatDuration(e.time, timeUnit), formatBytes(e.size),
    ]);
  });
  const ws2 = XLSX.utils.aoa_to_sheet(detailRows);
  XLSX.utils.book_append_sheet(wb, ws2, 'Advanced Detail');

  XLSX.writeFile(wb, (baseName || 'har') + '_export.xlsx');
}

/* ---------------------------------------------------------------------- */
/* Virtualized list — variable item height, hand-rolled windowing          */
/* ---------------------------------------------------------------------- */

function VirtualList({ items, itemHeight, height, renderItem, overscan = 6, getKey }) {
  const [scrollTop, setScrollTop] = useState(0);
  const onScroll = useCallback((e) => setScrollTop(e.target.scrollTop), []);
  const heightFn = typeof itemHeight === 'function' ? itemHeight : () => itemHeight;

  const layout = useMemo(() => {
    let offset = 0;
    return items.map((item, i) => {
      const h = heightFn(item, i);
      const l = { top: offset, height: h };
      offset += h;
      return l;
    });
  }, [items, itemHeight]);

  const total = layout.length ? layout[layout.length - 1].top + layout[layout.length - 1].height : 0;

  let lo = 0, hi = layout.length - 1, start = 0;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (layout[mid].top + layout[mid].height < scrollTop) lo = mid + 1;
    else { start = mid; hi = mid - 1; }
  }
  start = Math.max(0, start - overscan);
  let end = start;
  while (end < layout.length && layout[end].top < scrollTop + height) end++;
  end = Math.min(layout.length, end + overscan);

  const visible = items.slice(start, end);

  return (
    <div onScroll={onScroll} style={{ height, overflowY: 'auto', position: 'relative' }}>
      <div style={{ height: total, position: 'relative' }}>
        {visible.map((item, i) => {
          const index = start + i;
          const l = layout[index];
          return (
            <div key={getKey ? getKey(item) : index} style={{ position: 'absolute', top: l.top, left: 0, right: 0, height: l.height }}>
              {renderItem(item, index)}
            </div>
          );
        })}
      </div>
    </div>
  );
}

  constructor(props) { super(props); this.state = { hasError: false }; }

      return (
        <div className="p-10 text-center">

          <div className="font-semibold text-red mb-2">Something went wrong rendering this HAR file.</div>

  }
}

function NameSearchDropdown({ options, selected, onChange }) {
  const [open, setOpen] = useState(false);
  const [query, setQuery] = useState('');
  const [draft, setDraft] = useState(selected);
  const ref = useRef(null);

  useEffect(() => {
    function onDocClick(e) { if (ref.current && !ref.current.contains(e.target)) setOpen(false); }
    document.addEventListener('click', onDocClick);
    return () => document.removeEventListener('click', onDocClick);
  }, []);

  useEffect(() => { if (open) { setDraft(selected); setQuery(''); } }, [open]);

  const filtered = query.trim()
    ? options.filter(o => o.value.toLowerCase().includes(query.trim().toLowerCase()))
    : options;

  function toggleVal(v) {
    setDraft(prev => {
      const next = new Set(prev);
      if (next.has(v)) next.delete(v); else next.add(v);
      return next;
    });
  }
  function apply() { onChange(draft); setOpen(false); }
  function clearAll() { onChange(new Set()); setOpen(false); }

  return (
    <div ref={ref} className="relative ml-auto flex-1 min-w-[160px] max-w-[280px]">
      <input
        value={query}
        onFocus={() => setOpen(true)}
        onChange={e => { setQuery(e.target.value); setOpen(true); }}
        placeholder={selected.size ? `${selected.size} API${selected.size !== 1 ? 's' : ''} selected` : 'Filter by API name…'}
        className="w-full border border-line rounded-lg px-3 py-2 text-sm bg-paper focus:outline-none focus:border-blue"
      />
      {open && (
        <div className="absolute top-[calc(100%+4px)] left-0 right-0 bg-paper-raised border border-line rounded-lg shadow-lg z-30">
          <div className="max-h-60 overflow-y-auto">
            {filtered.length === 0 && <div className="px-3 py-2 text-xs text-ink-soft">No matches</div>}
            {filtered.map(opt => (
              <label key={opt.value} className="flex items-center gap-2 px-3 py-1.5 text-xs cursor-pointer hover:bg-paper">
                <input type="checkbox" checked={draft.has(opt.value)} onChange={() => toggleVal(opt.value)} className="accent-blue w-3.5 h-3.5" />
                <span className="truncate">{opt.value}</span>
                <span className="ml-auto text-ink-soft font-mono">{opt.count}</span>
              </label>
            ))}
          </div>
          <div className="flex justify-between px-3 py-2 border-t border-line">
            <button onClick={clearAll} className="text-[11px] font-semibold text-ink-soft">Clear all</button>
            <button onClick={apply} className="text-[11px] font-semibold text-blue">Apply</button>
          </div>
        </div>
      )}
    </div>
  );
}

function CopyLinkButton({ getUrl }) {
  const [copied, setCopied] = useState(false);
  function handleClick() {
    // Compute (and commit to the address bar) the hash fresh, right now — never rely on the
    // background debounced sync, which could still be mid-flight if the user just changed a
    // filter and clicked this immediately, copying a stale link.
    const url = getUrl ? getUrl() : window.location.href;
    navigator.clipboard.writeText(url).then(() => {
      setCopied(true);
      setTimeout(() => setCopied(false), 1500);
    }).catch(() => {});
  }
  return (
    <button
      onClick={handleClick}
      title="Copies a link that restores your current view and filters. The HAR file itself isn't included — re-open it after following this link."
      className="inline-flex items-center justify-center min-w-[100px] border border-line rounded-md px-2.5 py-1 font-semibold hover:bg-paper text-ink flex-shrink-0"
    >
      {copied ? '✓ Copied' : '🔗 Copy link'}
    </button>
  );
}

// Phase colors deliberately use the default Tailwind palette rather than the app's semantic
// tokens (green/amber/red/blue) — a phase (DNS, connect, wait...) isn't a pass/fail signal,
// so reusing the status colors here would visually conflate the two.
const PHASE_COLORS = {
  dns: 'bg-violet-400',
  connect: 'bg-sky-400',
  wait: 'bg-amber-400',
  download: 'bg-emerald-400',
  other: 'bg-slate-300',
};
const PHASE_LABELS = {
  dns: 'DNS', connect: 'Connect/SSL', wait: 'Wait (TTFB)', download: 'Download', other: 'Other',
};

function PulseRow({ entry, minStart, span, timeUnit, thresholdMs }) {
  const color = statusColor(entry.status, entry.time, thresholdMs);
  const left = Math.min(100, Math.max(0, ((entry.startedDateTime - minStart) / span) * 100));
  const width = Math.max(0.6, Math.min(100 - left, (entry.time / span) * 100));

  // Stack dns/connect/wait/download proportionally within the entry's own bar — "other" absorbs
  // send time plus any unaccounted queuing/blocked time so the stack always fills the bar exactly.
  const known = entry.dns + entry.connect + entry.wait + entry.download;
  const other = Math.max(0, entry.time - known);
  const total = Math.max(1, entry.time || known + other);
  let cursor = 0;
  const phases = [
    { key: 'dns', ms: entry.dns },
    { key: 'connect', ms: entry.connect },
    { key: 'wait', ms: entry.wait },
    { key: 'download', ms: entry.download },
    { key: 'other', ms: other },
  ].filter(p => p.ms > 0).map(p => {
    const segLeft = (cursor / total) * 100;
    cursor += p.ms;
    return { ...p, segLeft, segWidth: (p.ms / total) * 100 };
  });

  // One combined tooltip for the whole bar (name, total, every phase present) rather than a
  // separate tooltip per segment — hovering anywhere on the bar shows the full breakdown at once.
  const tooltipText = [
    entry.name,
    `Total: ${formatDuration(entry.time, timeUnit)}`,
    ...phases.map(p => `${PHASE_LABELS[p.key]}: ${formatDuration(p.ms, timeUnit)}`),
  ].join('\n');

  return (
    <div className="flex items-center gap-3 h-10 border-b border-line pr-1">
      <span className={`w-2.5 h-2.5 rounded-full flex-shrink-0 bg-${color}`}></span>
      <span className="w-36 flex-shrink-0 text-sm font-medium truncate" title={entry.name}>{entry.name}</span>
      <div className="flex-1 h-2 bg-paper rounded overflow-hidden relative" title={tooltipText}>
        <div className="absolute top-0 bottom-0 rounded overflow-hidden" style={{ left: left + '%', width: width + '%' }}>
          {phases.map(p => (
            <div
              key={p.key}
              className={`absolute top-0 bottom-0 ${PHASE_COLORS[p.key]}`}
              style={{ left: p.segLeft + '%', width: p.segWidth + '%' }}
            ></div>
          ))}
        </div>
      </div>

function PricingModal({ open, onClose, modelNames, pricing, onSave }) {
  const [rows, setRows] = useState([]);
  useEffect(() => {
    if (!open) return;
    // Only models actually seen in THIS HAR file are shown — rates saved for other models (e.g.
    // from a previously loaded file) stay in the persisted table untouched, just out of view here.
    setRows(modelNames.map(name => {
      const p = pricing[name];
      return { name, in: p ? String(p.in) : '', out: p ? String(p.out) : '' };
    }));
  }, [open, modelNames, pricing]);

  if (!open) return null;

  function updateRow(i, patch) { setRows(prev => prev.map((r, idx) => idx === i ? { ...r, ...patch } : r)); }
  function removeRow(i) { setRows(prev => prev.filter((_, idx) => idx !== i)); }
  function addRow() { setRows(prev => [...prev, { name: '', in: '', out: '' }]); }
  function save() {
    // Start from the full existing table (preserves rates for models not in this file) and only
    // replace the slice this modal actually shows/edits.
    const next = { ...pricing };
    modelNames.forEach(name => { delete next[name]; });
    rows.forEach(r => {
      const inPrice = Number(r.in), outPrice = Number(r.out);
      if (r.name && r.in !== '' && r.out !== '' && !isNaN(inPrice) && !isNaN(outPrice) && inPrice >= 0 && outPrice >= 0) {
        next[r.name] = { in: inPrice, out: outPrice };
      }
    });
    onSave(next);
    onClose();
  }

  const usedNames = new Set(rows.map(r => r.name).filter(Boolean));
  const canAddMore = usedNames.size < modelNames.length;

  return (
    <div className="fixed inset-0 bg-black/45 flex items-center justify-center p-5 z-[90]" onClick={onClose}>
      <div className="w-full max-w-[480px] max-h-[85vh] bg-paper-raised border border-line rounded-xl shadow-2xl overflow-hidden flex flex-col" onClick={e => e.stopPropagation()}>

          <button onClick={onClose} className="w-7 h-7 rounded-md border border-line flex items-center justify-center text-ink-soft hover:bg-paper">✕</button>
        </div>

        <div className="flex-1 min-h-0 overflow-y-auto px-5">
          <div className="mt-3 bg-blue-bg border border-blue rounded-lg px-3 py-2 text-[11px] leading-relaxed">
            Rates are estimates you set — not fetched live. Longer name matches win (e.g. "gpt-4o" beats "gpt-4").
          </div>

          {rows.length > 0 && (
            <div className="flex gap-2 pt-3 text-[10px] uppercase tracking-wide text-ink-soft font-semibold">
              <span className="flex-1">Model name</span><span className="w-[76px]">Input</span><span className="w-[76px]">Output</span>
            </div>
          )}
          <div className="pt-1.5 pb-3 flex flex-col gap-2">
            {rows.map((row, i) => (
              <div key={i} className="flex gap-2 items-center">
                <select
                  value={row.name}
                  onChange={e => updateRow(i, { name: e.target.value })}
                  className="flex-1 min-w-0 border border-line rounded-md bg-paper text-sm px-2.5 py-2"
                >
                  <option value="" disabled>Select model…</option>
                  {modelNames.filter(n => n === row.name || !usedNames.has(n)).map(n => (
                    <option key={n} value={n}>{n}</option>
                  ))}
                </select>
                <input
                  type="number"
                  value={row.in}
                  onChange={e => updateRow(i, { in: e.target.value })}
                  placeholder="in"
                  className="w-[76px] flex-shrink-0 border border-line rounded-md bg-paper text-sm font-mono px-2 py-2 outline-none"
                />
                <input
                  type="number"
                  value={row.out}
                  onChange={e => updateRow(i, { out: e.target.value })}
                  placeholder="out"
                  className="w-[76px] flex-shrink-0 border border-line rounded-md bg-paper text-sm font-mono px-2 py-2 outline-none"
                />
                <button onClick={() => removeRow(i)} className="w-8 h-8 flex-shrink-0 border border-line rounded-md flex items-center justify-center text-red hover:bg-red-bg">🗑</button>
              </div>
            ))}
          </div>

          <button
            onClick={addRow}
            disabled={!canAddMore}
            className="mb-3 flex items-center justify-center gap-1.5 border border-dashed border-line rounded-lg py-2 text-xs font-semibold text-blue w-full disabled:opacity-40 disabled:cursor-not-allowed"
          >
            + Add model
          </button>
        </div>

        <div className="flex-shrink-0 flex justify-end gap-2 px-5 py-3 border-t border-line">
          <button onClick={onClose} className="border border-line rounded-md px-4 py-2 text-xs font-semibold text-ink-soft hover:bg-paper">Cancel</button>
          <button onClick={save} className="border border-blue bg-blue rounded-md px-4 py-2 text-xs font-semibold text-white">Save changes</button>
        </div>
      </div>
    </div>
  );

function InsightCard({ finding }) {
  const [expanded, setExpanded] = useState(false);
  const toneClass = finding.severity === 'red' ? 'text-red' : 'text-amber';
  const bgClass = finding.severity === 'red' ? 'bg-red-bg border-red' : 'bg-amber-bg border-amber';

  // finding.entries is one row per affected CALL, so the same name repeats once per call
  // (that's the whole point of e.g. "duplicate requests"). Collapse to distinct method+name
  // pairs with a ×N call count — grouped the same way computeInsights counted them in the
  // first place, so this list's row count always matches the description's number. Grouping
  // by name alone would silently fold e.g. "GET /users" and "DELETE /users" into one row and
  // make the displayed count disagree with the finding's own count.
  const grouped = useMemo(() => {
    if (!finding.entries) return [];
    const m = new Map();
    finding.entries.forEach(e => {
      const key = e.method + ' ' + e.name;
      const cur = m.get(key);
      if (cur) cur.count += 1;
      else m.set(key, { method: e.method, name: e.name, count: 1 });
    });
    return [...m.values()].sort((a, b) => b.count - a.count);
  }, [finding.entries]);

  return (
    <div className={`border rounded-lg px-4 py-3 ${bgClass}`}>
      <div className="flex items-center justify-between gap-2">
        <div className={`font-semibold text-sm ${toneClass}`}>{finding.title}</div>
        {finding.count != null && <span className="font-mono text-xs text-ink-soft">{finding.count}</span>}
      </div>
      <div className="text-xs text-ink-soft mt-1 leading-relaxed">{finding.description}</div>
      {grouped.length > 0 && (
        <button onClick={() => setExpanded(x => !x)} className="text-[11px] font-semibold text-blue mt-1.5">
          {expanded ? 'Hide' : 'Show'} affected requests
        </button>
      )}
      {expanded && (
        <div className="mt-2 max-h-40 overflow-y-auto border-t border-line/40">
          {grouped.slice(0, 50).map(g => (
            <div key={g.method + ' ' + g.name} className="flex items-center gap-2 w-full text-[11px] font-mono text-ink-soft px-0.5 py-1 border-b border-line/20">
              <span className="font-bold flex-shrink-0">{g.method}</span>
              <span className="truncate" title={g.name}>{g.name}</span>
              {g.count > 1 && <span className="ml-auto flex-shrink-0 text-ink-soft/80">×{g.count}</span>}
            </div>
          ))}
          {grouped.length > 50 && (
            <div className="text-[11px] text-ink-soft italic px-0.5 py-1">…and {grouped.length - 50} more</div>
          )}
        </div>
      )}
    </div>
  );
}

function ApiTimePopover({ open, onClose, rawEntries, timeUnit }) {
  const ref = useRef(null);
  // Attach once at mount (not re-attached per open/close toggle) — an [open]-dependent
  // attach races the very click that opens it: React flushes discrete click updates
  // synchronously, so a listener attached during that flush can still catch the tail of
  // the same click's bubble to `document` and immediately close what just opened.
  useEffect(() => {
    function onDocClick(e) { if (ref.current && !ref.current.contains(e.target)) onClose(); }
    document.addEventListener('click', onDocClick);
    return () => document.removeEventListener('click', onDocClick);
  }, []);

  const rows = useMemo(() => {
    const m = new Map();
    rawEntries.forEach(e => {
      const cur = m.get(e.name) || { totalTime: 0, count: 0 };
      cur.totalTime += e.time;
      cur.count += 1;
      m.set(e.name, cur);
    });
    return [...m.entries()].map(([name, v]) => ({ name, ...v })).sort((a, b) => b.totalTime - a.totalTime);
  }, [rawEntries]);

  if (!open) return null;

  return (
    <div ref={ref} className="absolute top-[calc(100%+6px)] left-0 z-40 min-w-[260px] max-w-[320px] bg-paper-raised border border-line rounded-lg shadow-lg" onClick={e => e.stopPropagation()}>
      <div className="px-3 py-2 border-b border-line text-[11px] font-semibold text-ink-soft uppercase tracking-wide">Total time per API</div>
      <div className="max-h-64 overflow-y-auto py-1">
        {rows.map(r => (
          <div key={r.name} className="flex items-center gap-2 px-3 py-1.5 text-xs">
            <span className="truncate flex-1" title={r.name}>{r.name}</span>
            <span className="text-ink-soft font-mono flex-shrink-0">×{r.count}</span>
            <span className="font-mono font-semibold flex-shrink-0 w-16 text-right">{formatDuration(r.totalTime, timeUnit)}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

}

function FilterPopover({ id, openId, setOpenId, options, selected, onApply, searchable, sortToggle, sortMode, onSortModeChange, colorFn }) {
  const isOpen = openId === id;
  const [draft, setDraft] = useState(selected);
  const [query, setQuery] = useState('');
  const btnRef = useRef(null);
  const popRef = useRef(null);
  useEffect(() => { if (isOpen) { setDraft(selected); setQuery(''); } }, [isOpen]);

  // Positioned via a portal to document.body so the dropdown escapes the table's overflow
  // context entirely (an ancestor with overflow-x-auto also clips overflow-y, and an
  // absolutely-positioned popover doesn't grow that ancestor's auto height — see spec v3 §3.4).
  useEffect(() => {
    if (!isOpen || !btnRef.current || !popRef.current || !window.FloatingUIDOM) return;
    const { computePosition, offset, flip, shift, size, autoUpdate } = window.FloatingUIDOM;
    const IDEAL_MAX_HEIGHT = 330; // header/search/sort + ~7 option rows + footer, at natural size
    const update = () => {
      // strategy MUST match the CSS position we actually render with (position:'fixed' below).
      // Floating UI defaults to 'absolute', whose coordinates bake in the document scroll
      // offset — applied to a `position:fixed` element that offset is wrong and grows with
      // every scroll, which is exactly why the popover used to drift and land near the
      // bottom of the page after scrolling down before opening it.
      computePosition(btnRef.current, popRef.current, {
        strategy: 'fixed',
        placement: 'bottom-start',
        middleware: [
          offset(4),
          flip({ padding: 8, fallbackPlacements: ['top-start', 'bottom-end', 'top-end'] }),
          shift({ padding: 8 }),
          // In short viewports neither side may have enough room for the popover at its
          // natural height — flip alone can't fix that (it only picks a side, it doesn't
          // shrink). size() caps the popover to whatever space is actually available in the
          // chosen direction, so the footer (Clear/Apply) always stays inside the visible,
          // capped popover instead of being pushed past the viewport edge.
          size({
            padding: 8,
            apply({ availableHeight }) {
              if (popRef.current) {
                popRef.current.style.maxHeight = Math.max(150, Math.min(IDEAL_MAX_HEIGHT, availableHeight)) + 'px';
              }
            },
          }),
        ],
      }).then(({ x, y }) => {
        if (popRef.current) Object.assign(popRef.current.style, { left: x + 'px', top: y + 'px' });
      });
    };
    // animationFrame mode drives repositioning off a continuous rAF loop instead of scroll/
    // resize listeners — plain scroll-event-driven updates visibly lag behind fast/fling
    // scrolling (the popover "catches up" in jumps); rAF tracking stays smooth right through it.
    return autoUpdate(btnRef.current, popRef.current, update, { animationFrame: true });
  }, [isOpen]);

  const filteredOptions = searchable && query.trim()
    ? options.filter(o => String(o.value).toLowerCase().includes(query.trim().toLowerCase()))
    : options;

  function toggleVal(v) {
    setDraft(prev => {
      const next = new Set(prev);
      if (next.has(v)) next.delete(v); else next.add(v);
      return next;
    });
  }
  function apply() { onApply(draft); setOpenId(null); }
  function clear() { onApply(new Set()); setOpenId(null); }
  const activeCount = selected.size;

  return (
    <span className="relative inline-block">
      <button
        ref={btnRef}
        onClick={(e) => { e.stopPropagation(); setOpenId(isOpen ? null : id); }}
        className={`inline-flex items-center justify-center w-8 h-8 rounded-md border relative ${activeCount ? 'bg-blue border-blue text-white' : 'border-line bg-paper-raised text-ink-soft'}`}
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="w-3 h-3"><path d="M4 5h16M7 12h10M10 19h4"/></svg>
        {activeCount > 0 && <span className="absolute -top-1.5 -right-1.5 bg-blue text-white rounded-full text-[9px] font-mono px-1 font-bold leading-tight">{activeCount}</span>}
      </button>
      {isOpen && ReactDOM.createPortal(
        <div
          ref={popRef}
          onClick={e => e.stopPropagation()}
          style={{ position: 'fixed', top: 0, left: 0 }}
          className="min-w-[190px] max-w-[260px] bg-paper-raised border border-line rounded-lg shadow-lg z-[100] normal-case tracking-normal font-normal flex flex-col overflow-hidden"
        >
          {/* Only the options list scrolls (capped to ~7 rows, or less if the viewport is too
              short — see the size() middleware above) — the Clear/Apply footer sits outside
              that scroll area in normal flow, so it's always fully visible immediately on
              open, never truncated, regardless of how many options there are or how short the
              screen is. */}
          {sortToggle && (
            <div className="flex gap-1 p-2 border-b border-line flex-shrink-0">
              <button onClick={() => onSortModeChange('default')} className={`flex-1 text-[10px] font-semibold rounded px-2 py-1 ${sortMode === 'default' ? 'bg-ink text-paper' : 'bg-paper text-ink-soft'}`}>Default</button>
              <button onClick={() => onSortModeChange('az')} className={`flex-1 text-[10px] font-semibold rounded px-2 py-1 ${sortMode === 'az' ? 'bg-ink text-paper' : 'bg-paper text-ink-soft'}`}>A–Z</button>
            </div>
          )}
          {searchable && (
            <input value={query} onChange={e => setQuery(e.target.value)} placeholder="Search…" className="m-2.5 px-2.5 py-1.5 border border-line rounded-md text-xs w-[calc(100%-20px)] focus:outline-none focus:border-blue flex-shrink-0" />
          )}
          <div className="flex-1 min-h-0 overflow-y-auto py-0.5">
            {filteredOptions.length === 0 && <div className="px-3 py-2 text-xs text-ink-soft">No options</div>}
            {filteredOptions.map(opt => (
              <label key={String(opt.value)} className="flex items-center gap-2 px-3 py-1.5 text-xs cursor-pointer hover:bg-paper">
                <input type="checkbox" checked={draft.has(opt.value)} onChange={() => toggleVal(opt.value)} className="accent-blue w-3.5 h-3.5" />
                {colorFn && <span className={`w-1.5 h-1.5 rounded-full bg-${colorFn(opt.value)} flex-shrink-0`}></span>}
                <span className="truncate">{String(opt.value)}</span>
                <span className="ml-auto text-ink-soft font-mono">{opt.count}</span>
              </label>
            ))}
          </div>
          <div className="flex justify-between px-3 py-2 border-t border-line flex-shrink-0">
            <button onClick={clear} className="text-[11px] font-semibold text-ink-soft">Clear</button>
            <button onClick={apply} className="text-[11px] font-semibold text-blue">Apply</button>
          </div>
        </div>,
        document.body
      )}
    </span>
  );
}

/* Inline detail panel: pretty-print + full-text search highlighting       */
/* ---------------------------------------------------------------------- */

function DetailTextBlock({ text, searchTerm }) {
  const MAX_DISPLAY = 50000;
  const pretty = useMemo(() => prettyPrintMaybeJson(text), [text]);
  const displayPretty = pretty.length > MAX_DISPLAY ? pretty.slice(0, MAX_DISPLAY) + '\n\n… truncated' : pretty;
  const trimmedTerm = (searchTerm || '').trim();
  const markRefs = useRef([]);
  const [matchCursor, setMatchCursor] = useState(0);

  const matches = useMemo(() => {
    if (!trimmedTerm) return [];
    const lower = displayPretty.toLowerCase();
    const needle = trimmedTerm.toLowerCase();
    const out = [];
    let idx = 0;
    while (true) {
      const found = lower.indexOf(needle, idx);
      if (found === -1) break;
      out.push([found, found + needle.length]);
      idx = found + needle.length;
    }
    return out;
  }, [displayPretty, trimmedTerm]);

  useEffect(() => { setMatchCursor(0); }, [displayPretty, trimmedTerm]);
  useEffect(() => {
    if (matches.length && markRefs.current[matchCursor]) {
      markRefs.current[matchCursor].scrollIntoView({ block: 'center' });
    }
  }, [matchCursor, matches.length]);

  markRefs.current = [];

  let content;
  if (!text) {
    content = <div className="text-ink-soft">No content captured.</div>;
  } else if (matches.length) {
    const segs = [];
    let last = 0;
    matches.forEach(([s, e], i) => {
      if (s > last) segs.push(<span key={'t' + i}>{displayPretty.slice(last, s)}</span>);
      segs.push(
        <mark
          key={'m' + i}
          ref={el => markRefs.current[i] = el}
          className={i === matchCursor ? 'bg-amber text-white rounded px-0.5' : 'bg-amber-bg text-ink rounded px-0.5'}
        >{displayPretty.slice(s, e)}</mark>
      );
      last = e;
    });
    if (last < displayPretty.length) segs.push(<span key="tail">{displayPretty.slice(last)}</span>);
    content = <div className="whitespace-pre-wrap break-all">{segs}</div>;
  } else if (trimmedTerm) {
    content = <div className="whitespace-pre-wrap break-all">{displayPretty}</div>;
  } else {
    const tokens = highlightJsonTokens(displayPretty);
    content = <div className="whitespace-pre-wrap break-all">{tokens.map((t, i) => <span key={i} className={t.cls}>{t.text}</span>)}</div>;
  }

  return (
    <div>
      {trimmedTerm && matches.length > 0 && (
        <div className="flex items-center gap-2 mb-2 text-[11px] text-ink-soft">
          <span>{matchCursor + 1} of {matches.length} matches</span>
          <button onClick={() => setMatchCursor(c => (c - 1 + matches.length) % matches.length)} className="border border-line rounded px-1.5 py-0.5 bg-paper-raised">↑</button>
          <button onClick={() => setMatchCursor(c => (c + 1) % matches.length)} className="border border-line rounded px-1.5 py-0.5 bg-paper-raised">↓</button>
        </div>
      )}
      <div className="max-h-64 overflow-auto pr-1">{content}</div>
    </div>
  );
}

function downloadFile(content, filename, mimeType) {
  const blob = new Blob([content], { type: mimeType });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function AddEditNodeModal({ node, onSave, onClose }) {
  const [name, setName] = useState(node?.name || node?.friendlyName || '');
  const [host, setHost] = useState(node?.host || '');
  const [group, setGroup] = useState(node?.group || 'Services');
  const [description, setDescription] = useState(node?.description || '');

  function handleSubmit(e) {
    e.preventDefault();
    if (!name.trim()) return;
    const nodeId = node?.id || `https://${host || name.toLowerCase().replace(/\s+/g, '-') + '.api'}`;
    onSave({
      id: nodeId,
      name: name.trim(),
      friendlyName: name.trim(),
      host: host.trim() || name.trim(),
      group: group.trim() || 'Services',
      description: description.trim(),
    });
  }

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-ink/40 backdrop-blur-xs p-4">
      <div className="bg-paper-raised border border-line rounded-xl p-5 max-w-md w-full shadow-xl space-y-4">
        <div className="flex items-center justify-between border-b border-line pb-3">
          <h3 className="font-bold text-base text-ink">{node ? 'Edit API / Service Node' : 'Add API / Service Node'}</h3>
          <button onClick={onClose} className="text-ink-soft hover:text-ink font-mono text-sm">✕</button>
        </div>

        <form onSubmit={handleSubmit} className="space-y-3 text-xs">
          <div>
            <label className="font-semibold text-ink block mb-1">API Name / Label</label>
            <input
              value={name}
              onChange={e => setName(e.target.value)}
              placeholder="e.g. Stripe Payment API"
              className="w-full border border-line rounded-lg p-2 bg-paper text-ink"
              required
            />
          </div>

          <div>
            <label className="font-semibold text-ink block mb-1">Host / Base URL</label>
            <input
              value={host}
              onChange={e => setHost(e.target.value)}
              placeholder="e.g. api.stripe.com"
              className="w-full border border-line rounded-lg p-2 bg-paper text-ink font-mono"
            />
          </div>

          <div>
            <label className="font-semibold text-ink block mb-1">Group / Subsystem</label>
            <input
              value={group}
              onChange={e => setGroup(e.target.value)}
              placeholder="e.g. Finance, Security, Core"
              className="w-full border border-line rounded-lg p-2 bg-paper text-ink"
            />
          </div>

          <div>
            <label className="font-semibold text-ink block mb-1">Description / Role</label>
            <textarea
              value={description}
              onChange={e => setDescription(e.target.value)}
              placeholder="Brief summary of what this service handles..."
              rows={2}
              className="w-full border border-line rounded-lg p-2 bg-paper text-ink"
            />
          </div>

          <div className="flex justify-end gap-2 pt-2 border-t border-line">
            <button type="button" onClick={onClose} className="px-3 py-1.5 rounded-lg border border-line hover:bg-paper text-ink">Cancel</button>
            <button type="submit" className="px-4 py-1.5 rounded-lg bg-blue text-white font-semibold hover:bg-blue/90">Save API Node</button>
          </div>
        </form>
      </div>
    </div>
  );
}

function AddEditLinkModal({ link, prefilledSource, services = [], onSave, onClose }) {
  const [sourceServiceId, setSourceServiceId] = useState(link?.sourceServiceId || prefilledSource?.id || services[0]?.id || '');
  const [targetServiceId, setTargetServiceId] = useState(link?.targetServiceId || (services[1]?.id || services[0]?.id || ''));
  const [linkType, setLinkType] = useState(link?.type || 'data_flow');
  const [status, setStatus] = useState(link?.status || 'user-confirmed');
  const [attributesText, setAttributesText] = useState((link?.attributeNames || []).join(', '));
  const [description, setDescription] = useState(link?.description || '');

  function handleSubmit(e) {
    e.preventDefault();
    if (!sourceServiceId || !targetServiceId || sourceServiceId === targetServiceId) {
      alert('Source and target services must be distinct.');
      return;
    }

    const srcObj = services.find(s => s.id === sourceServiceId);
    const tgtObj = services.find(s => s.id === targetServiceId);

    const attributes = attributesText.split(',').map(s => s.trim()).filter(Boolean);

    onSave({
      id: link?.id || `rel_${sourceServiceId}->${targetServiceId}`,
      sourceServiceId,
      targetServiceId,
      sourceServiceName: srcObj?.friendlyName || srcObj?.name || sourceServiceId,
      targetServiceName: tgtObj?.friendlyName || tgtObj?.name || targetServiceId,
      type: linkType,
      status,
      attributeNames: attributes.length > 0 ? attributes : (linkType === 'api_call' ? ['API Call'] : ['Data']),
      description: description.trim(),
    });
  }

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-ink/40 backdrop-blur-xs p-4">
      <div className="bg-paper-raised border border-line rounded-xl p-5 max-w-md w-full shadow-xl space-y-4">
        <div className="flex items-center justify-between border-b border-line pb-3">
          <h3 className="font-bold text-base text-ink">{link ? 'Edit Architecture Relationship' : 'Add New Relationship'}</h3>
          <button onClick={onClose} className="text-ink-soft hover:text-ink font-mono text-sm">✕</button>
        </div>

        <form onSubmit={handleSubmit} className="space-y-3 text-xs">
          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className="font-semibold text-ink block mb-1">Source API (Caller / Sender)</label>
              <select
                value={sourceServiceId}
                onChange={e => setSourceServiceId(e.target.value)}
                className="w-full border border-line rounded-lg p-2 bg-paper text-ink font-semibold"
              >
                {services.map(s => <option key={s.id} value={s.id}>{s.friendlyName || s.name}</option>)}
              </select>
            </div>

            <div>
              <label className="font-semibold text-ink block mb-1">Target API (Receiver)</label>
              <select
                value={targetServiceId}
                onChange={e => setTargetServiceId(e.target.value)}
                className="w-full border border-line rounded-lg p-2 bg-paper text-ink font-semibold"
              >
                {services.map(s => <option key={s.id} value={s.id}>{s.friendlyName || s.name}</option>)}
              </select>
            </div>
          </div>

          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className="font-semibold text-ink block mb-1">Relationship Type</label>
              <select
                value={linkType}
                onChange={e => setLinkType(e.target.value)}
                className="w-full border border-line rounded-lg p-2 bg-paper text-ink font-semibold"
              >
                <option value="data_flow">🌊 Data Flow (Dashed)</option>
                <option value="api_call">📞 API Call (Solid)</option>
              </select>
            </div>

            <div>
              <label className="font-semibold text-ink block mb-1">Confirmation Status</label>
              <select
                value={status}
                onChange={e => setStatus(e.target.value)}
                className="w-full border border-line rounded-lg p-2 bg-paper text-ink font-semibold"
              >
                <option value="user-confirmed">✓ User Confirmed</option>
                <option value="user-created">✏️ User Created</option>
                <option value="inferred">⚡ Inferred</option>
              </select>
            </div>
          </div>

          <div>
            <label className="font-semibold text-ink block mb-1">Carried Information Attributes</label>
            <input
              value={attributesText}
              onChange={e => setAttributesText(e.target.value)}
              placeholder="e.g. Account ID, Auth Token, Order ID"
              className="w-full border border-line rounded-lg p-2 bg-paper text-ink"
            />
            <span className="text-[10px] text-ink-soft">Comma-separated list of attributes or parameters</span>
          </div>

          <div>
            <label className="font-semibold text-ink block mb-1">Notes / Provenance</label>
            <textarea
              value={description}
              onChange={e => setDescription(e.target.value)}
              placeholder="e.g. Verified from auth architecture specification..."
              rows={2}
              className="w-full border border-line rounded-lg p-2 bg-paper text-ink"
            />
          </div>

          <div className="flex justify-end gap-2 pt-2 border-t border-line">
            <button type="button" onClick={onClose} className="px-3 py-1.5 rounded-lg border border-line hover:bg-paper text-ink">Cancel</button>
            <button type="submit" className="px-4 py-1.5 rounded-lg bg-blue text-white font-semibold hover:bg-blue/90">Save Relationship</button>
          </div>
        </form>
      </div>
    </div>
  );
}

function AppKnowledgeModal({ knowledge, onUpdateKnowledge, onResetToInference, onClose }) {
  const [appName, setAppName] = useState(knowledge?.appName || 'My Application');
  const [importJsonText, setImportJsonText] = useState('');
  const [importError, setImportError] = useState(null);

  function handleSaveName() {
    onUpdateKnowledge(prev => ({
      ...prev,
      appName: appName.trim() || 'My Application',
      updatedAt: new Date().toISOString()
    }));
    alert('Application name updated!');
  }

  function handleExport() {
    const jsonStr = HarAnalyzer.exportAppKnowledgeToJson(knowledge);
    downloadFile(jsonStr, `${knowledge.appId || 'app'}_knowledge.json`, 'application/json');
  }

  function handleImport() {
    setImportError(null);
    const parsed = HarAnalyzer.importAppKnowledgeFromJson(importJsonText);
    if (!parsed) {
      setImportError('Invalid App Knowledge JSON format.');
      return;
    }
    onUpdateKnowledge(parsed);
    alert('App Knowledge imported successfully!');
    onClose();
  }

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-ink/40 backdrop-blur-xs p-4">
      <div className="bg-paper-raised border border-line rounded-xl p-5 max-w-lg w-full shadow-xl space-y-4 max-h-[85vh] overflow-y-auto">
        <div className="flex items-center justify-between border-b border-line pb-3">
          <div>
            <h3 className="font-bold text-base text-ink">Structured Application Knowledge</h3>
            <p className="text-xs text-ink-soft">Persist user-confirmed architecture corrections for reuse across future HAR files.</p>
          </div>
          <button onClick={onClose} className="text-ink-soft hover:text-ink font-mono text-sm">✕</button>
        </div>

        <div className="space-y-3 text-xs">
          <div className="bg-paper p-3 rounded-lg border border-line space-y-2">
            <label className="font-semibold text-ink block">Application Profile Name</label>
            <div className="flex gap-2">
              <input
                value={appName}
                onChange={e => setAppName(e.target.value)}
                className="flex-1 border border-line rounded-lg p-1.5 bg-paper text-ink font-semibold"
              />
              <button onClick={handleSaveName} className="px-3 py-1 bg-paper-raised border border-line rounded-lg font-semibold hover:bg-paper">
                Save
              </button>
            </div>
            <div className="text-[10px] text-ink-soft font-mono">
              Profile ID: {knowledge?.appId} • Last Updated: {new Date(knowledge?.updatedAt || Date.now()).toLocaleTimeString()}
            </div>
          </div>

          {/* Export & Import */}
          <div className="grid grid-cols-2 gap-2">
            <button
              onClick={handleExport}
              className="p-3 bg-paper border border-line rounded-lg font-bold text-ink hover:bg-paper-raised transition-colors flex flex-col items-center gap-1 text-center"
            >
              <span className="text-base">📤</span>
              <span>Export Knowledge JSON</span>
              <span className="text-[9px] font-normal text-ink-soft">Save to file for your team</span>
            </button>

            <button
              onClick={onResetToInference}
              className="p-3 bg-paper border border-line rounded-lg font-bold text-red hover:bg-red-bg transition-colors flex flex-col items-center gap-1 text-center"
            >
              <span className="text-base">🔄</span>
              <span>Reset to HAR Inference</span>
              <span className="text-[9px] font-normal text-ink-soft">Discard confirmed overrides</span>
            </button>
          </div>

          {/* Import JSON Box */}
          <div className="space-y-1.5">
            <label className="font-semibold text-ink block">Import Knowledge JSON</label>
            <textarea
              value={importJsonText}
              onChange={e => setImportJsonText(e.target.value)}
              placeholder="Paste exported App Knowledge JSON here..."
              rows={4}
              className="w-full border border-line rounded-lg p-2 bg-paper text-ink font-mono text-[11px]"
            />
            {importError && <div className="text-red text-[11px] font-semibold">{importError}</div>}
            {importJsonText && (
              <button
                onClick={handleImport}
                className="w-full py-1.5 bg-blue text-white rounded-lg font-semibold hover:bg-blue/90"
              >
                Apply Imported Knowledge
              </button>
            )}
          </div>
        </div>

        <div className="flex justify-end pt-2 border-t border-line">
          <button onClick={onClose} className="px-4 py-1.5 rounded-lg bg-paper border border-line font-semibold text-ink hover:bg-paper-raised">
            Close
          </button>
        </div>
      </div>
    </div>
  );
}

function ConflictReviewModal({ conflicts = [], onResolve, onClose }) {
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-ink/40 backdrop-blur-xs p-4">
      <div className="bg-paper-raised border border-line rounded-xl p-5 max-w-lg w-full shadow-xl space-y-4 max-h-[85vh] overflow-y-auto">
        <div className="flex items-center justify-between border-b border-line pb-3">
          <div>
            <h3 className="font-bold text-base text-ink flex items-center gap-2">
              <span>⚠️</span> HAR vs Confirmed Knowledge Review
            </h3>
            <p className="text-xs text-ink-soft">Review discrepancies between newly uploaded HAR file and your confirmed architecture knowledge.</p>
          </div>
          <button onClick={onClose} className="text-ink-soft hover:text-ink font-mono text-sm">✕</button>
        </div>

        <div className="space-y-2.5 text-xs">
          {conflicts.map((c, i) => (
            <div key={i} className="bg-paper border border-amber/40 rounded-lg p-3 space-y-2">
              <div className="flex items-center justify-between">
                <span className="font-bold text-ink">{c.title}</span>
                <span className="text-[9px] bg-amber-bg text-amber font-bold px-1.5 py-0.2 rounded uppercase">
                  {c.severity}
                </span>
              </div>

              <div className="text-ink-soft leading-relaxed">
                {c.description}
              </div>

              <div className="flex justify-end gap-2 pt-1">
                <button
                  onClick={() => onResolve(c.id, 'keep')}
                  className="px-2.5 py-1 bg-paper-raised border border-line rounded text-[11px] font-semibold hover:bg-paper"
                >
                  Keep Confirmed Knowledge
                </button>
                <button
                  onClick={() => onResolve(c.id, 'accept')}
                  className="px-2.5 py-1 bg-blue text-white rounded text-[11px] font-semibold hover:bg-blue/90"
                >
                  Accept HAR Evidence
                </button>
              </div>
            </div>
          ))}
        </div>

        <div className="flex justify-end pt-2 border-t border-line">
          <button onClick={onClose} className="px-4 py-1.5 rounded-lg bg-paper border border-line font-semibold text-ink hover:bg-paper-raised">
            Dismiss
          </button>
        </div>
      </div>
    </div>
  );
}

function AdvancedView({
  rawEntries, entries, preColumnEntries, advSearch,
  typeFilter, setTypeFilter,
  statusFilter, setStatusFilter, methodFilter, setMethodFilter, nameFilter, setNameFilter,
  modelFilter, setModelFilter,
  nameFilterSortMode, setNameFilterSortMode,
  sortConfig, setSortConfig, expandedId, setExpandedId,
  onClearAll,
  onOpenDataFlow, dataFlowStats,
}) {
  const [openPopover, setOpenPopover] = useState(null);
  useEffect(() => {
    function onDocClick() { setOpenPopover(null); }
    document.addEventListener('click', onDocClick);
    return () => document.removeEventListener('click', onDocClick);
  }, []);

  const statusOptions = useMemo(() => buildStatusOptions(preColumnEntries), [preColumnEntries]);
  const methodOptions = useMemo(() => buildMethodOptions(preColumnEntries), [preColumnEntries]);
  const nameOptions = useMemo(() => buildNameOptions(preColumnEntries, nameFilterSortMode), [preColumnEntries, nameFilterSortMode]);
  const modelOptions = useMemo(() => buildModelOptions(preColumnEntries), [preColumnEntries]);

  function toggleExpanded(id) { setExpandedId(prev => prev === id ? null : id); }

  const displayItems = useMemo(() => {
    const out = [];
    entries.forEach(e => {
      out.push({ kind: 'row', id: 'row-' + e.id, entry: e });
      if (expandedId === e.id) out.push({ kind: 'detail', id: 'detail-' + e.id, entry: e });
    });
    return out;
  }, [entries, expandedId]);

  const VIRTUALIZE_THRESHOLD = 640;
  const naturalHeight = useMemo(
    () => displayItems.reduce((sum, item) => sum + (item.kind === 'detail' ? DETAIL_H : ROW_H), 0),
    [displayItems]
  );
  const shouldVirtualize = naturalHeight > VIRTUALIZE_THRESHOLD;

  const activeFilterTags = [];
  if (typeFilter !== 'All') activeFilterTags.push(`Type: ${typeFilter}`);
  if (statusFilter.size) activeFilterTags.push(`Status: ${[...statusFilter].join(', ')}`);
  if (methodFilter.size) activeFilterTags.push(`Method: ${[...methodFilter].join(', ')}`);
  if (nameFilter.size) activeFilterTags.push(`Name: ${nameFilter.size} selected`);
  if (modelFilter.size) activeFilterTags.push(`Model: ${[...modelFilter].join(', ')}`);
  if (advSearch.trim()) activeFilterTags.push(`Search: "${advSearch.trim()}"`);
  const isFiltered = entries.length !== rawEntries.length;

  return (
    <div>
      {/* Advanced Toolbar: Type filters on left, Feature 1 & 2 Analyzer Icons on right */}
      <div className="flex items-center justify-between gap-2 px-5 py-4 border-b border-line flex-wrap">
        <div className="flex gap-2 flex-wrap">
          {TYPE_OPTIONS.map(t => (
            <button
              key={t}
              onClick={() => setTypeFilter(t)}
              className={`rounded-full border px-3 py-1.5 text-xs font-medium ${typeFilter === t ? 'bg-blue border-blue text-white' : 'border-line text-ink-soft hover:bg-paper'}`}>
              {t}
            </button>
          ))}
        </div>

        {/* Observed Data Flow View Switcher Button */}
        <div className="flex items-center gap-2 ml-auto flex-shrink-0">
          <button
            onClick={onOpenDataFlow}
            title="Switch to Observed Data Flow View"
            aria-label="Observed Data Flow View"
            className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-line bg-paper text-ink hover:bg-blue-bg hover:border-blue hover:text-blue transition-colors text-xs font-semibold shadow-xs"
          >
            <svg className="w-3.5 h-3.5 text-blue" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
              <circle cx="6" cy="6" r="3"/>
              <circle cx="18" cy="6" r="3"/>
              <circle cx="12" cy="18" r="3"/>
              <path d="M8.5 7.5 15.5 7.5"/>
              <path d="M7.5 8.5 10.5 15.5"/>
              <path d="M16.5 8.5 13.5 15.5"/>
            </svg>
            <span>Observed Data Flow</span>
            {dataFlowStats && dataFlowStats.totalRelationships > 0 && (
              <span className="bg-blue text-white rounded-full px-1.5 py-0.2 text-[10px] font-mono font-bold leading-tight">
                {dataFlowStats.totalRelationships}
              </span>
            )}
          </button>
        </div>
      </div>

      {(activeFilterTags.length > 0 || isFiltered) && (
        <div className="flex items-center gap-2 px-5 py-2.5 text-xs text-ink-soft bg-blue-bg border-b border-line flex-wrap">
          {activeFilterTags.length > 0 && <span className="font-semibold text-ink">Filtered:</span>}
          {activeFilterTags.map((t, i) => <span key={i} className="bg-paper-raised border border-line rounded-md px-2 py-1 font-mono text-[11px]">{t}</span>)}
          <span>Showing {entries.length} of {rawEntries.length} requests</span>
          <button onClick={onClearAll} className="ml-auto text-blue font-semibold">Clear all</button>
        </div>
      )}

      <div className="overflow-x-auto">
        <div className="min-w-[760px]">
          <div className="grid items-center gap-3 px-5 py-2.5 border-b border-line" style={{ gridTemplateColumns: ADV_COLS }}>
            <span></span>
            <FilterableHeader label="Status" id="status" openId={openPopover} setOpenId={setOpenPopover} options={statusOptions} selected={statusFilter} onApply={setStatusFilter} colorFn={pureStatusColor} />
            <FilterableHeader label="Method" id="method" openId={openPopover} setOpenId={setOpenPopover} options={methodOptions} selected={methodFilter} onApply={setMethodFilter} />
            <FilterableHeader label="Name" id="name" openId={openPopover} setOpenId={setOpenPopover} options={nameOptions} selected={nameFilter} onApply={setNameFilter} searchable sortToggle sortMode={nameFilterSortMode} onSortModeChange={setNameFilterSortMode} />
            <FilterableHeader label="Model" id="model" openId={openPopover} setOpenId={setOpenPopover} options={modelOptions} selected={modelFilter} onApply={setModelFilter} />
            <SortHeader label="Size" sortKey="size" sortConfig={sortConfig} setSortConfig={setSortConfig} />
            <SortHeader label="Start" sortKey="startedDateTime" sortConfig={sortConfig} setSortConfig={setSortConfig} />
            <SortHeader label="End" sortKey="endTime" sortConfig={sortConfig} setSortConfig={setSortConfig} />
            <SortHeader label="Time" sortKey="time" sortConfig={sortConfig} setSortConfig={setSortConfig} />
          </div>
          {entries.length === 0 ? (
            <div className="px-5 py-10 text-center text-ink-soft text-sm">No requests match these filters.</div>
          ) : shouldVirtualize ? (
            <VirtualList
              items={displayItems}
              itemHeight={item => item.kind === 'detail' ? DETAIL_H : ROW_H}
              height={VIRTUALIZE_THRESHOLD}
              getKey={item => item.id}
              renderItem={item => item.kind === 'row'
                ? <AdvancedRow entry={item.entry} expanded={expandedId === item.entry.id} onToggle={toggleExpanded} />
                : <InlineDetailPanel entry={item.entry} searchTerm={advSearch} />}
            />
          ) : (
            <div>
              {displayItems.map(item => (
                <div key={item.id}>
                  {item.kind === 'row'
                    ? <AdvancedRow entry={item.entry} expanded={expandedId === item.entry.id} onToggle={toggleExpanded} />
                    : <InlineDetailPanel entry={item.entry} searchTerm={advSearch} />}
                </div>
              ))}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/* App                                                                      */
/* ---------------------------------------------------------------------- */

function App() {
  const [rawEntries, setRawEntries] = useState(null);
  const [meta, setMeta] = useState(null);
  const [error, setError] = useState(null);
  const [isParsing, setIsParsing] = useState(false);
  const [fileName, setFileName] = useState('');
  const [mode, setMode] = useState('simple');
  const [timeUnit, setTimeUnit] = useState(() => sessionStorage.getItem('har_viewer_time_unit') || 's');
  const [timezone, setTimezone] = useState(() => sessionStorage.getItem('har_viewer_timezone') || 'GMT');
  const [theme, setTheme] = useState(() => sessionStorage.getItem('har_viewer_theme') || 'light');

  // Simple mode filters
  const [simpleSelectedNames, setSimpleSelectedNames] = useState(new Set());
  const [colorFilter, setColorFilter] = useState(new Set());
  const [thresholds, setThresholds] = useState({});
  // Pricing is a cost-rate config the user tunes, not a per-tab display preference like
  // mode/timeUnit/timezone — it belongs in localStorage so it survives across files/sessions.
  const [pricingTable, setPricingTable] = useState(() => {
    try {
      const stored = localStorage.getItem('har_viewer_pricing');
      return stored ? JSON.parse(stored) : DEFAULT_PRICING;
    } catch (err) { return DEFAULT_PRICING; }
  });
  useEffect(() => {
    try { localStorage.setItem('har_viewer_pricing', JSON.stringify(pricingTable)); } catch (err) {}
  }, [pricingTable]);

  // Advanced mode filters
  const [advSearchRaw, setAdvSearchRaw] = useState('');
  const [advSearch, setAdvSearch] = useState('');
  const [typeFilter, setTypeFilter] = useState('All');
  const [statusFilter, setStatusFilter] = useState(new Set());
  const [methodFilter, setMethodFilter] = useState(new Set());
  const [nameFilter, setNameFilter] = useState(new Set());
  const [modelFilter, setModelFilter] = useState(new Set());
  const [nameFilterSortMode, setNameFilterSortMode] = useState('default');
  const [sortConfig, setSortConfig] = useState({ key: 'startedDateTime', dir: 'asc' });
  const [expandedId, setExpandedId] = useState(null);

  // Data Flow View Options State
  const [dataFlowGroupMode, setDataFlowGroupMode] = useState('service');
  const [dataFlowSearch, setDataFlowSearch] = useState('');
  const [dataFlowFilterApi, setDataFlowFilterApi] = useState('all');
  const [dataFlowShowTechnical, setDataFlowShowTechnical] = useState(false);

  // Memoized Observed Data Flow Model
  const dataFlowModel = useMemo(() => {
    if (!rawEntries || typeof HarAnalyzer === 'undefined') return null;
    try {
      return HarAnalyzer.analyzeObservedDataFlow(rawEntries, {
        groupMode: dataFlowGroupMode,
      });
    } catch (err) {
      console.error('Failed to analyze observed data flow:', err);
      return null;
    }
  }, [rawEntries, dataFlowGroupMode]);

  function handleNavigateToEntry(entryIndex) {
    setMode('advanced');
    setExpandedId(entryIndex);
  }

  // Set once a shareable-URL hash is successfully applied on mount, so the very next
  // handleFile() upload skips its usual resetFilters() and keeps the restored view.
  const hashRestoredRef = useRef(false);
  // Reactive twin of hashRestoredRef (refs don't trigger renders) — drives the "this link has
  // saved filters, upload the file to apply them" banner on the upload screen.
  const [hashPending, setHashPending] = useState(false);
  // Mirrors rawEntries for the hashchange listener below, whose closure is only ever created
  // once — reading state directly there would always see the stale (null) value from mount.
  const rawEntriesRef = useRef(null);
  useEffect(() => { rawEntriesRef.current = rawEntries; }, [rawEntries]);

  // Mode is not persisted to sessionStorage (always defaults to simple)
  useEffect(() => { sessionStorage.setItem('har_viewer_time_unit', timeUnit); }, [timeUnit]);
  useEffect(() => { sessionStorage.setItem('har_viewer_timezone', timezone); }, [timezone]);
  useEffect(() => {
    sessionStorage.setItem('har_viewer_theme', theme);
    document.documentElement.dataset.theme = theme;
  }, [theme]);

  // Debounce the (potentially expensive) full-text Advanced search.
  useEffect(() => {
    const t = setTimeout(() => setAdvSearch(advSearchRaw), 220);
    return () => clearTimeout(t);
  }, [advSearchRaw]);

  // Restore a shared/bookmarked view (mode + filters) from the URL hash — on mount, AND on every
  // 'hashchange'. The mount-only case alone isn't enough: pasting a new shared link into a tab
  // that already has this same page open is a same-document, fragment-only navigation (per the
  // HTML spec) — the browser doesn't reload/remount React, it only fires 'hashchange'. Without
  // this listener that link's filters (and the "saved view" banner) would silently never appear,
  // even though the address bar itself shows the new hash correctly.
  useEffect(() => {
    function restoreFromHash() {
      // Don't clobber an already-loaded session — this only matters for the upload screen.
      if (rawEntriesRef.current) return;
      const payload = decodeStateFromHash(window.location.hash);
      if (!payload) return;
      hashRestoredRef.current = true;
      setHashPending(true);
      if (payload.mode === 'simple' || payload.mode === 'advanced') setMode(payload.mode);
      if (payload.simple) {
        if (Array.isArray(payload.simple.selectedNames)) setSimpleSelectedNames(new Set(payload.simple.selectedNames));
        if (Array.isArray(payload.simple.colorFilter)) setColorFilter(new Set(payload.simple.colorFilter));
        if (payload.simple.thresholds && typeof payload.simple.thresholds === 'object') setThresholds(payload.simple.thresholds);
      }
      if (payload.advanced) {
        const a = payload.advanced;
        if (typeof a.search === 'string') { setAdvSearchRaw(a.search); setAdvSearch(a.search); }
        if (typeof a.typeFilter === 'string') setTypeFilter(a.typeFilter);
        if (Array.isArray(a.statusFilter)) setStatusFilter(new Set(a.statusFilter));
        if (Array.isArray(a.methodFilter)) setMethodFilter(new Set(a.methodFilter));
        if (Array.isArray(a.nameFilter)) setNameFilter(new Set(a.nameFilter));
        if (Array.isArray(a.modelFilter)) setModelFilter(new Set(a.modelFilter));
        if (a.sortConfig && a.sortConfig.key) setSortConfig(a.sortConfig);
      }
    }
    restoreFromHash();
    window.addEventListener('hashchange', restoreFromHash);
    return () => window.removeEventListener('hashchange', restoreFromHash);
  }, []);

  function currentShareState() {
    return {
      mode, simpleSelectedNames, colorFilter, thresholds,
      advSearch, typeFilter, statusFilter, methodFilter, nameFilter, modelFilter, sortConfig,
    };
  }

  // Sync the current view back into the URL hash (debounced, via replaceState so it doesn't
  // spam browser history) — only once a file is loaded, so this never clobbers a shared link's
  // hash before the recipient has had a chance to upload their own copy of the file.
  useEffect(() => {
    if (!rawEntries) return;
    const t = setTimeout(() => {
      const encoded = encodeStateToHash(currentShareState());
      if (encoded) window.history.replaceState(null, '', '#' + encoded);
    }, 400);
    return () => clearTimeout(t);
  }, [rawEntries, mode, simpleSelectedNames, colorFilter, thresholds, advSearch, typeFilter, statusFilter, methodFilter, nameFilter, modelFilter, sortConfig]);

  // Computes the link fresh at click-time (never trusts the debounced background sync above,
  // which could still be mid-flight) and commits it to the address bar before returning it, so
  // the copied URL and what's shown in the browser always agree.
  function buildShareUrl() {
    const encoded = encodeStateToHash(currentShareState());
    if (encoded) window.history.replaceState(null, '', '#' + encoded);
    return window.location.href;
  }

  function handleFile(file) {
    setError(null);
    setIsParsing(true);
    const reader = new FileReader();
    reader.onload = e => {
      setTimeout(() => {
        try {
          const parsed = parseHar(e.target.result);
          setRawEntries(parsed.entries);
          setMeta(parsed.meta);
          setFileName(file.name);
          setMode('simple');
          if (hashRestoredRef.current) {
            hashRestoredRef.current = false;
            setHashPending(false);
          } else {
            resetFilters();
          }
        } catch (err) {
          setError(err.message);
          setRawEntries(null);
          setMeta(null);
        } finally {
          setIsParsing(false);
        }
      }, 20);
    };
    reader.onerror = () => { setError('Could not read the file. Please try again.'); setIsParsing(false); };
    reader.readAsText(file);
  }

  function resetFilters() {
    setMode('simple');
    setSimpleSelectedNames(new Set());
    setColorFilter(new Set());
    setThresholds({});
    setAdvSearchRaw('');
    setAdvSearch('');
    setTypeFilter('All');
    setStatusFilter(new Set());
    setMethodFilter(new Set());
    setNameFilter(new Set());
    setModelFilter(new Set());
    setNameFilterSortMode('default');
    setExpandedId(null);
  }

  function handleReset() {
    setRawEntries(null);
    setMeta(null);
    setError(null);
    setFileName('');
    hashRestoredRef.current = false;
    setHashPending(false);
    resetFilters();
  }

  const simpleNameOptions = useMemo(() => rawEntries ? buildNameOptions(rawEntries, 'default') : [], [rawEntries]);

  const simpleFilteredEntries = useMemo(() => {
    if (!rawEntries) return [];
    let list = rawEntries;
    if (simpleSelectedNames.size) list = list.filter(e => simpleSelectedNames.has(e.name));
    if (colorFilter.size) list = list.filter(e => colorFilter.has(statusColor(e.status, e.time, thresholds[e.name])));
    return list;
  }, [rawEntries, simpleSelectedNames, colorFilter, thresholds]);

  const advPreColumnEntries = useMemo(() => {
    if (!rawEntries) return [];
    let list = rawEntries;
    const q = advSearch.trim().toLowerCase();
    if (q) {
      list = list.filter(e =>
        e.name.toLowerCase().includes(q) ||
        e.domain.toLowerCase().includes(q) ||
        (e.postData && e.postData.text && e.postData.text.toLowerCase().includes(q)) ||
        (e.content && e.content.text && e.content.text.toLowerCase().includes(q))
      );
    }
    if (typeFilter !== 'All') list = list.filter(e => e.type === typeFilter);
    return list;
  }, [rawEntries, advSearch, typeFilter]);

  const advancedEntries = useMemo(() => {
    let list = advPreColumnEntries;
    if (statusFilter.size) list = list.filter(e => statusFilter.has(e.status));
    if (methodFilter.size) list = list.filter(e => methodFilter.has(e.method));
    if (nameFilter.size) list = list.filter(e => nameFilter.has(e.name));
    if (modelFilter.size) list = list.filter(e => modelFilter.has(e.model || '(none)'));
    const { key, dir } = sortConfig;
    list = [...list].sort((a, b) => {
      let av = a[key], bv = b[key];
      if (typeof av === 'string') { av = av.toLowerCase(); bv = bv.toLowerCase(); }
      if (av == null) av = '';
      if (bv == null) bv = '';
      if (av < bv) return dir === 'asc' ? -1 : 1;
      if (av > bv) return dir === 'asc' ? 1 : -1;
      return 0;
    });
    return list;
  }, [advPreColumnEntries, statusFilter, methodFilter, nameFilter, modelFilter, sortConfig]);

  function handleClearAllAdvancedFilters() {
    setAdvSearchRaw('');
    setAdvSearch('');
    setTypeFilter('All');
    setStatusFilter(new Set());
    setMethodFilter(new Set());
    setNameFilter(new Set());
    setModelFilter(new Set());
  }

  function handleExport() {
    if (!rawEntries) return;
    const base = fileName ? fileName.replace(/\.[^.]+$/, '') : 'har';
    const exportEntries = mode === 'simple' ? simpleFilteredEntries : advancedEntries;
    const isFilteredExport = exportEntries.length !== rawEntries.length;
    const exportMeta = isFilteredExport ? computeMeta(exportEntries) : meta;
    exportToExcel(exportEntries, exportMeta, timeUnit, timezone, base + (isFilteredExport ? '_filtered' : ''));
  }

  const hasData = !!rawEntries && !error;

  const settingsValue = useMemo(() => ({ timeUnit, setTimeUnit, timezone, setTimezone, theme, setTheme }), [timeUnit, timezone, theme]);

  return (
    <SettingsContext.Provider value={settingsValue}>
      <div className="min-h-screen bg-paper text-ink font-sans">
        <div className="max-w-[1120px] mx-auto my-8 bg-paper-raised border border-line rounded-xl overflow-hidden shadow-sm">
          <TopBar
            mode={mode} setMode={setMode} hasData={hasData} fileName={fileName} onReset={handleReset} onExport={handleExport}
            getShareUrl={buildShareUrl}
            nameOptions={simpleNameOptions} simpleSelectedNames={simpleSelectedNames} setSimpleSelectedNames={setSimpleSelectedNames}
            advSearch={advSearchRaw} setAdvSearch={setAdvSearchRaw}
            dataFlowCount={dataFlowModel ? (dataFlowModel.graph.edges.length || 0) : 0}
          />

          {!rawEntries && !error && !isParsing && <UploadZone onFile={handleFile} hashPending={hashPending} />}
          {isParsing && <ParsingState />}
          {error && <ErrorState message={error} onRetry={handleReset} />}

          {hasData && mode === 'simple' && (
            <SimpleView
              rawEntries={rawEntries} entries={simpleFilteredEntries} meta={meta}
              onShowAdvanced={() => setMode('advanced')}
              colorFilter={colorFilter} setColorFilter={setColorFilter}
              thresholds={thresholds} setThresholds={setThresholds}
              pricingTable={pricingTable} setPricingTable={setPricingTable}
            />
          )}
          {hasData && mode === 'advanced' && (
            <AdvancedView
              rawEntries={rawEntries} entries={advancedEntries} preColumnEntries={advPreColumnEntries} advSearch={advSearch}
              typeFilter={typeFilter} setTypeFilter={setTypeFilter}
              statusFilter={statusFilter} setStatusFilter={setStatusFilter}
              methodFilter={methodFilter} setMethodFilter={setMethodFilter}
              nameFilter={nameFilter} setNameFilter={setNameFilter}
              modelFilter={modelFilter} setModelFilter={setModelFilter}
              nameFilterSortMode={nameFilterSortMode} setNameFilterSortMode={setNameFilterSortMode}
              sortConfig={sortConfig} setSortConfig={setSortConfig}
              expandedId={expandedId} setExpandedId={setExpandedId}
              onClearAll={handleClearAllAdvancedFilters}
              onOpenDataFlow={() => setMode('data-flow')}
              dataFlowStats={dataFlowModel ? dataFlowModel.statistics : null}
            />
          )}
          {hasData && mode === 'data-flow' && (
            <DataFlowView
              rawEntries={rawEntries}
              dataFlowModel={dataFlowModel}
              groupMode={dataFlowGroupMode}
              setGroupMode={(mode) => { setDataFlowGroupMode(mode); setDataFlowFilterApi('all'); }}
              searchQuery={dataFlowSearch}
              setSearchQuery={setDataFlowSearch}
              filterApi={dataFlowFilterApi}
              setFilterApi={setDataFlowFilterApi}
              showTechnical={dataFlowShowTechnical}
              setShowTechnical={setDataFlowShowTechnical}
              onNavigateToEntry={handleNavigateToEntry}
            />
          )}
        </div>
      </div>
    </SettingsContext.Provider>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<AppErrorBoundary><App /></AppErrorBoundary>);
</script>
</body>
</html>

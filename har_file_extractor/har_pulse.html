/* FEATURE: Editable API Communication & Data Flow Architecture Engine   */
/* ---------------------------------------------------------------------- */

function DataFlowGraphCanvas({
  apiNodes,
  apiConnections,
  selectedConnection,
  onSelectConnection,
  selectedNodeId,
  onSelectNode,
  activeTrace,
  onSelectTrace,
  onOpenDiagnostics,
  onUpdateNodeLayout,
  onQuickConfirmConnection,
  onReverseConnection,
  onDeleteConnection,
  onOpenEditConnection,
  onOpenAddConnectionFromNode,
  onOpenEditNode,
  onDeleteNode,
  appKnowledge,
  onResetLayout,
  showApiCalls = true,
  showDataFlows = true,
}) {
  const containerRef = useRef(null);
  const [zoom, setZoom] = useState(1);
  const [pan, setPan] = useState({ x: 0, y: 0 });
  const [isPanning, setIsPanning] = useState(false);
  const [panStart, setPanStart] = useState({ x: 0, y: 0 });
  const [hoveredNodeId, setHoveredNodeId] = useState(null);
  const [hoveredConnectionId, setHoveredConnectionId] = useState(null);
  const [draggingNode, setDraggingNode] = useState(null);

  // Position cache: retains exact coordinates across any node/link adds, edits, or deletes
  const cachedPositionsRef = useRef(new Map());
  const hasAutoFittedRef = useRef(false);
  const dragDistanceRef = useRef(0);

  const visibleConnections = useMemo(() => {
    return (apiConnections || []).filter(c => {
      if (c.type === 'api_call' && !showApiCalls) return false;
      if (c.type === 'data_flow' && !showDataFlows) return false;
      return true;
    });
  }, [apiConnections, showApiCalls, showDataFlows]);

  /* ---- Position retention and layout computation ---- */
  const { nodeLayouts, edgePaths, canvasWidth, canvasHeight } = useMemo(() => {
    if (!apiNodes || apiNodes.length === 0) {
      return { nodeLayouts: new Map(), edgePaths: [], canvasWidth: 960, canvasHeight: 520 };
    }

    const nodeW = 230;
    const nodeH = 80;
    const hGap = 50;
    const vGap = 110;
    const layouts = new Map();

    // Check which nodes already have locked/cached positions
    const unpositionedNodes = [];
    let maxX = 80;
    let maxY = 50;

    apiNodes.forEach(node => {
      const explicitPos = (appKnowledge && appKnowledge.layout && appKnowledge.layout[node.id]) || node.layout;
      const cachedPos = cachedPositionsRef.current.get(node.id);
      const pos = explicitPos || cachedPos;

      if (pos && typeof pos.x === 'number' && typeof pos.y === 'number') {
        layouts.set(node.id, {
          x: pos.x,
          y: pos.y,
          width: nodeW,
          height: nodeH,
          node,
        });
        cachedPositionsRef.current.set(node.id, { x: pos.x, y: pos.y });
        if (pos.x + nodeW > maxX) maxX = pos.x + nodeW;
        if (pos.y + nodeH > maxY) maxY = pos.y + nodeH;
      } else {
        unpositionedNodes.push(node);
      }
    });

    // If there are unpositioned nodes (e.g. initial load or new node added), position them
    if (unpositionedNodes.length > 0) {
      const nodeIds = apiNodes.map(n => n.id);
      const inDegreeMap = new Map();
      const adj = new Map();
      nodeIds.forEach(id => { inDegreeMap.set(id, 0); adj.set(id, []); });

      visibleConnections.forEach(c => {
        if (adj.has(c.sourceServiceId) && adj.has(c.targetServiceId) && c.sourceServiceId !== c.targetServiceId) {
          adj.get(c.sourceServiceId).push(c.targetServiceId);
          inDegreeMap.set(c.targetServiceId, inDegreeMap.get(c.targetServiceId) + 1);
        }
      });

      const rankMap = new Map();
      const queue = [];
      nodeIds.forEach(id => { if (inDegreeMap.get(id) === 0) { rankMap.set(id, 0); queue.push(id); } });
      if (queue.length === 0 && nodeIds.length > 0) { rankMap.set(nodeIds[0], 0); queue.push(nodeIds[0]); }

      const visited = new Set();
      let iters = 0;
      const maxIter = nodeIds.length * 3 + 50;
      while (queue.length > 0 && iters++ < maxIter) {
        const curr = queue.shift();
        visited.add(curr);
        const currRank = rankMap.get(curr) || 0;
        (adj.get(curr) || []).forEach(nxt => {
          const nr = currRank + 1;
          if (!rankMap.has(nxt) || rankMap.get(nxt) < nr) rankMap.set(nxt, nr);
          if (!visited.has(nxt) && !queue.includes(nxt)) queue.push(nxt);
        });
      }
      nodeIds.forEach((id, i) => { if (!rankMap.has(id)) rankMap.set(id, i % 4); });

      const rows = new Map();
      apiNodes.forEach(n => {
        const r = rankMap.get(n.id) || 0;
        if (!rows.has(r)) rows.set(r, []);
        rows.get(r).push(n);
      });

      const sortedRanks = [...rows.keys()].sort((a, b) => a - b);
      let maxRowWidth = 0;
      sortedRanks.forEach(rank => {
        const rowNodes = rows.get(rank) || [];
        const rowWidth = rowNodes.length * nodeW + (rowNodes.length - 1) * hGap;
        if (rowWidth > maxRowWidth) maxRowWidth = rowWidth;
      });

      const autoCanvasW = Math.max(960, maxRowWidth + 160);
      let totalH = 50;

      sortedRanks.forEach(rank => {
        const rowNodes = rows.get(rank) || [];
        const rowWidth = rowNodes.length * nodeW + (rowNodes.length - 1) * hGap;
        const startX = (autoCanvasW - rowWidth) / 2;

        rowNodes.forEach((node, colIdx) => {
          if (!layouts.has(node.id)) {
            const x = startX + colIdx * (nodeW + hGap);
            const y = totalH;
            layouts.set(node.id, {
              x,
              y,
              width: nodeW,
              height: nodeH,
              node,
            });
            cachedPositionsRef.current.set(node.id, { x, y });
            if (x + nodeW > maxX) maxX = x + nodeW;
            if (y + nodeH > maxY) maxY = y + nodeH;
          }
        });
        totalH += nodeH + vGap;
      });
    }

    const canvasW = Math.max(960, maxX + 80);
    const canvasH = Math.max(520, maxY + 80);

    // Edge paths with clean bezier routing & bidirectional offsets
    const paths = visibleConnections.map((conn, idx) => {
      const srcL = layouts.get(conn.sourceServiceId);
      const tgtL = layouts.get(conn.targetServiceId);
      if (!srcL || !tgtL) return null;

      const isReverse = tgtL.y < srcL.y;
      const x1 = srcL.x + srcL.width / 2;
      const y1 = isReverse ? srcL.y : srcL.y + srcL.height;
      const x2 = tgtL.x + tgtL.width / 2;
      const y2 = isReverse ? tgtL.y + tgtL.height : tgtL.y;

      let d;
      let midX = (x1 + x2) / 2;
      let midY = (y1 + y2) / 2;

      if (!isReverse && y2 >= y1) {
        // Downward forward edge
        const curveOffset = (idx % 2 === 0 ? 0 : 25);
        midX += curveOffset;
        d = `M ${x1} ${y1} C ${x1 + curveOffset} ${midY}, ${x2 + curveOffset} ${midY}, ${x2} ${y2}`;
      } else {
        // Reverse/lateral edge - curve outward
        const offset = 80 + Math.abs(x2 - x1) * 0.2;
        const curveRight = Math.max(srcL.x + srcL.width, tgtL.x + tgtL.width) + offset;
        d = `M ${x1} ${y1} C ${curveRight} ${y1}, ${curveRight} ${y2}, ${x2} ${y2}`;
        midX = curveRight - 20;
        midY = (y1 + y2) / 2;
      }

      return { conn, d, midX, midY, x1, y1, x2, y2 };
    }).filter(Boolean);

    return { nodeLayouts: layouts, edgePaths: paths, canvasWidth: canvasW, canvasHeight: canvasH };
  }, [apiNodes, visibleConnections, appKnowledge]);

  /* ---- Dragging Canvas vs Dragging Node ---- */
  function handleMouseDown(e) {
    if (e.target.tagName === 'svg' || e.target.id === 'canvas-bg') {
      setIsPanning(true);
      dragDistanceRef.current = 0;
      setPanStart({ x: e.clientX - pan.x, y: e.clientY - pan.y });
    }
  }

  function handleMouseMove(e) {
    if (isPanning) {
      dragDistanceRef.current += 1;
      setPan({ x: e.clientX - panStart.x, y: e.clientY - panStart.y });
    } else if (draggingNode) {
      const dx = (e.clientX - draggingNode.startX) / zoom;
      const dy = (e.clientY - draggingNode.startY) / zoom;
      const newX = Math.round(draggingNode.origX + dx);
      const newY = Math.round(draggingNode.origY + dy);
      cachedPositionsRef.current.set(draggingNode.nodeId, { x: newX, y: newY });
      if (onUpdateNodeLayout) {
        onUpdateNodeLayout(draggingNode.nodeId, { x: newX, y: newY });
      }
    }
  }

  function handleMouseUp(e) {
    if (isPanning && dragDistanceRef.current < 5) {
      if (onSelectNode) onSelectNode(null);
      if (onSelectConnection) onSelectConnection(null);
    }
    setIsPanning(false);
    setDraggingNode(null);
  }

  function handleBgClick(e) {
    if (e.target.tagName === 'svg' || e.target.id === 'canvas-bg') {
      if (onSelectNode) onSelectNode(null);
      if (onSelectConnection) onSelectConnection(null);
    }
  }

  // Non-passive wheel listener attached to containerRef to prevent parent window scroll during 2-finger pinch/scroll
  useEffect(() => {
    const el = containerRef.current;
    if (!el) return;

    function handleWheelNative(e) {
      e.preventDefault();
      e.stopPropagation();

      if (e.ctrlKey) {
        const factor = Math.exp(-e.deltaY * 0.01);
        setZoom(z => Math.min(Math.max(z * factor, 0.25), 3));
      } else {
        const factor = e.deltaY < 0 ? 1.08 : 0.92;
        setZoom(z => Math.min(Math.max(z * factor, 0.25), 3));
      }
    }

    function handleTouchMove(e) {
      if (e.touches && e.touches.length > 1) {
        e.preventDefault();
      }
    }

    el.addEventListener('wheel', handleWheelNative, { passive: false });
    el.addEventListener('touchmove', handleTouchMove, { passive: false });
    return () => {
      el.removeEventListener('wheel', handleWheelNative);
      el.removeEventListener('touchmove', handleTouchMove);
    };
  }, []);

  const fitView = () => {
    if (!containerRef.current) return;
    const rect = containerRef.current.getBoundingClientRect();
    const sx = (rect.width - 60) / canvasWidth;
    const sy = (rect.height - 60) / canvasHeight;
    const nz = Math.min(Math.max(Math.min(sx, sy), 0.35), 1.4);
    setZoom(nz);
    setPan({ x: (rect.width - canvasWidth * nz) / 2, y: 30 });
  };

  // Only auto-fit once on initial data mount, not on every node/link edit
  useEffect(() => {
    if (apiNodes && apiNodes.length > 0 && !hasAutoFittedRef.current) {
      hasAutoFittedRef.current = true;
      setTimeout(fitView, 60);
    }
  }, [apiNodes?.length]);

  function startNodeDrag(e, nodeId) {
    e.stopPropagation();
    const currentLayout = nodeLayouts.get(nodeId);
    if (!currentLayout) return;
    setDraggingNode({
      nodeId,
      startX: e.clientX,
      startY: e.clientY,
      origX: currentLayout.x,
      origY: currentLayout.y
    });
  }

  return (
    <div
      ref={containerRef}
      onMouseDown={handleMouseDown}
      onMouseMove={handleMouseMove}
      onMouseUp={handleMouseUp}
      onMouseLeave={handleMouseUp}
      className="relative w-full bg-paper border border-line rounded-xl overflow-hidden select-none"
      style={{ height: 'calc(100vh - 220px)', minHeight: '520px' }}
    >
      {/* Top Toolbar Controls */}
      <div className="absolute top-3 right-3 z-20 flex items-center gap-1.5 bg-paper-raised/95 backdrop-blur-md border border-line rounded-lg p-1 shadow-sm text-xs font-semibold">
        <button onClick={() => setZoom(z => Math.max(z - 0.15, 0.25))} className="px-2 py-1 rounded hover:bg-paper text-ink transition-colors" title="Zoom Out">－</button>
        <span className="px-1.5 text-[11px] font-mono text-ink-soft">{Math.round(zoom * 100)}%</span>
        <button onClick={() => setZoom(z => Math.min(z + 0.15, 3))} className="px-2 py-1 rounded hover:bg-paper text-ink transition-colors" title="Zoom In">＋</button>
        <button onClick={() => { setZoom(1); setPan({ x: 0, y: 0 }); }} className="px-2 py-1 rounded hover:bg-paper text-ink transition-colors">1:1</button>
        <button onClick={fitView} className="px-2.5 py-1 rounded bg-paper border border-line hover:bg-paper-raised text-ink transition-colors font-medium">Fit</button>
        {onResetLayout && (
          <button
            onClick={() => {
              cachedPositionsRef.current.clear();
              if (onResetLayout) onResetLayout();
              setTimeout(fitView, 60);
            }}
            className="px-2.5 py-1 rounded bg-paper border border-line hover:bg-paper-raised text-ink transition-colors"
            title="Auto Align Layout"
          >
            ⚡ Auto Layout
          </button>
        )}
      </div>

      {/* Visual Legend (Bottom Left) */}
      <div className="absolute bottom-3 left-3 z-20 bg-paper-raised/95 backdrop-blur-md border border-line rounded-lg p-2.5 shadow-sm text-[11px] space-y-1.5 pointer-events-auto">
        <div className="font-bold text-ink uppercase tracking-wider text-[10px]">Architecture Legend</div>
        <div className="flex items-center gap-4 flex-wrap text-ink-soft font-medium">
          <div className="flex items-center gap-1.5" title="Direct API call observed">
            <span className="w-5 h-0.5 bg-[#3557d6] inline-block"></span>
            <span className="text-ink font-semibold">API Call (Solid)</span>
          </div>
          <div className="flex items-center gap-1.5" title="Value propagation inferred">
            <span className="w-5 h-0.5 border-t-2 border-dashed border-[#3557d6] inline-block"></span>
            <span className="text-ink font-semibold">Data Flow (Dashed)</span>
          </div>
          <div className="flex items-center gap-1.5" title="User verified architecture link">
            <span className="w-2.5 h-2.5 rounded-full bg-[#2f9e58] inline-block"></span>
            <span className="text-[#2f9e58] font-bold">✓ Confirmed</span>
          </div>
          <div className="flex items-center gap-1.5" title="Automatically inferred from traffic">
            <span className="w-2.5 h-2.5 rounded-full bg-[#3557d6] inline-block"></span>
            <span className="text-[#3557d6] font-bold">⚡ Inferred</span>
          </div>
          <div className="flex items-center gap-1.5" title="User created custom node/link">
            <span className="w-2.5 h-2.5 rounded-full bg-[#9333ea] inline-block"></span>
            <span className="text-[#9333ea] font-bold">✏️ Custom</span>
          </div>
        </div>
      </div>

      {/* Empty State */}
      {visibleConnections.length === 0 && apiNodes.length === 0 && (
        <div className="absolute inset-0 flex items-center justify-center pointer-events-none p-6 text-center z-10">
          <div className="bg-paper-raised/95 border border-line rounded-xl p-6 max-w-md shadow-lg space-y-3 pointer-events-auto backdrop-blur-sm">
            <div className="text-3xl">🌊</div>
            <div className="font-bold text-base text-ink">No architecture relationships found</div>
            <div className="text-xs text-ink-soft leading-relaxed">
              We couldn't find communication between APIs. You can add custom API nodes or link relationships manually.
            </div>
          </div>
        </div>
      )}

      {/* Main Interactive SVG Canvas */}
      <svg id="canvas-bg" onClick={handleBgClick} className="w-full h-full cursor-grab active:cursor-grabbing">
        <defs>
          <pattern id="grid-dots" width="24" height="24" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="0.7" className="fill-line/40" />
          </pattern>
          <marker id="arrow-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#3557d6" />
          </marker>
          <marker id="arrow-amber" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#d98e1f" />
          </marker>
          <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#2f9e58" />
          </marker>
          <marker id="arrow-purple" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#9333ea" />
          </marker>
        </defs>

        <rect id="canvas-bg" onClick={handleBgClick} width="100%" height="100%" fill="url(#grid-dots)" />

        <g transform={`translate(${pan.x}, ${pan.y}) scale(${zoom})`}>
          {/* Edges */}
          {edgePaths.map(({ conn, d, midX, midY }) => {
            const isSelected = selectedConnection && (selectedConnection.id === conn.id || (selectedConnection.sourceServiceId === conn.sourceServiceId && selectedConnection.targetServiceId === conn.targetServiceId));
            const isHovered = hoveredConnectionId === conn.id;
            const isNodeHover = hoveredNodeId && (hoveredNodeId === conn.sourceServiceId || hoveredNodeId === conn.targetServiceId);
            const isNodeSelected = selectedNodeId && (selectedNodeId === conn.sourceServiceId || selectedNodeId === conn.targetServiceId);
            const hasTrace = activeTrace && conn.information && conn.information.some(i =>
              (i.attributeName && i.attributeName.toLowerCase().includes(activeTrace.toLowerCase())) ||
              (i.rawPath && i.rawPath.toLowerCase().includes(activeTrace.toLowerCase()))
            );
            const isDimmed = activeTrace && !hasTrace;
            const highlight = isSelected || isHovered || hasTrace || isNodeHover || isNodeSelected;

            const isDataFlow = conn.type === 'data_flow';
            const isConfirmed = conn.status === 'user-confirmed' || conn.isUserConfirmed;
            const isCustom = conn.status === 'user-created';

            const strokeColor = highlight
              ? '#d98e1f'
              : isCustom
              ? '#9333ea'
              : isConfirmed
              ? '#2f9e58'
              : '#3557d6';

            const markerId = highlight
              ? 'url(#arrow-amber)'
              : isCustom
              ? 'url(#arrow-purple)'
              : isConfirmed
              ? 'url(#arrow-green)'
              : 'url(#arrow-blue)';

            const labelText = conn.informationCount <= 2
              ? (conn.attributeNames || []).join(', ') || (conn.type === 'api_call' ? 'API Call' : 'Data flow')
              : `${conn.informationCount} data fields`;

            return (
              <g key={conn.id} opacity={isDimmed ? 0.15 : 1} className="transition-opacity duration-150">
                {highlight && (
                  <path
                    d={d}
                    fill="none"
                    stroke="#d98e1f"
                    strokeWidth="8"
                    strokeOpacity="0.25"
                    strokeLinecap="round"
                  />
                )}
                <path
                  d={d}
                  fill="none"
                  stroke={strokeColor}
                  strokeWidth={highlight ? 2.5 : 1.8}
                  strokeDasharray={isDataFlow ? '6 4' : 'none'}
                  markerEnd={markerId}
                  className="cursor-pointer"
                  onClick={(e) => { e.stopPropagation(); onSelectConnection(conn); }}
                  onMouseEnter={() => setHoveredConnectionId(conn.id)}
                  onMouseLeave={() => setHoveredConnectionId(null)}
                />
                
                {/* Edge Label & Badges */}
                <foreignObject x={midX - 90} y={midY - 14} width="180" height="28" className="overflow-visible pointer-events-none">
                  <div
                    onClick={(e) => { e.stopPropagation(); onSelectConnection(conn); }}
                    onMouseEnter={() => setHoveredConnectionId(conn.id)}
                    onMouseLeave={() => setHoveredConnectionId(null)}
                    title={`${conn.sourceFriendlyName} -> ${conn.targetFriendlyName} (${conn.type === 'api_call' ? 'API Call' : 'Data Flow'})`}
                    className={`pointer-events-auto inline-flex items-center gap-1.5 mx-auto px-2 py-0.5 rounded-full text-[10px] font-medium shadow-xs cursor-pointer border whitespace-nowrap transition-all ${
                      isSelected || hasTrace
                        ? 'bg-amber text-paper border-amber font-bold ring-2 ring-amber/30'
                        : isConfirmed
                        ? 'bg-green-50 text-green-800 border-green-500 font-semibold'
                        : isCustom
                        ? 'bg-purple-50 text-purple-800 border-purple-400 font-semibold'
                        : 'bg-paper-raised text-ink-soft border-line hover:border-blue'
                    }`}
                    style={{ maxWidth: '175px' }}
                  >
                    <span className={`text-[9px] px-1 py-0.2 rounded font-bold uppercase tracking-wider ${
                      isConfirmed ? 'bg-green-200 text-green-900' : isCustom ? 'bg-purple-200 text-purple-900' : 'bg-blue-100 text-blue-900'
                    }`}>
                      {isConfirmed ? '✓ Confirmed' : isCustom ? '✏️ Custom' : '⚡ Inferred'}
                    </span>
                    <span className="truncate">{labelText}</span>
                  </div>
                </foreignObject>
              </g>
            );
          })}

          {/* Nodes */}
          {[...nodeLayouts.values()].map(({ x, y, width, height, node }) => {
            const isSelected = selectedNodeId === node.id;
            const isHovered = hoveredNodeId === node.id;
            const hasTrace = activeTrace && (
              (node.sentAttributesList || []).some(a => a.attributeName.toLowerCase().includes(activeTrace.toLowerCase())) ||
              (node.receivedAttributesList || []).some(a => a.attributeName.toLowerCase().includes(activeTrace.toLowerCase()))
            );
            const isDimmed = activeTrace && !hasTrace;
            const isCustom = node.isCustom;

            return (
              <foreignObject
                key={node.id}
                x={x}
                y={y}
                width={width}
                height={height}
                className="overflow-visible"
                opacity={isDimmed ? 0.25 : 1}
              >
                <div
                  onMouseDown={(e) => startNodeDrag(e, node.id)}
                  onClick={(e) => { e.stopPropagation(); onSelectNode(node.id); }}
                  onMouseEnter={() => setHoveredNodeId(node.id)}
                  onMouseLeave={() => setHoveredNodeId(null)}
                  className={`group relative w-full h-full bg-paper-raised rounded-xl border p-2.5 shadow-xs cursor-move transition-all duration-100 flex flex-col justify-between ${
                    isSelected ? 'border-blue ring-2 ring-blue/30 shadow-md'
                    : isHovered ? 'border-ink shadow-sm'
                    : hasTrace ? 'border-amber ring-2 ring-amber/30'
                    : isCustom ? 'border-purple-300'
                    : 'border-line'
                  }`}
                >
                  <div className="flex items-center justify-between gap-1 mb-1">
                    <span className="font-bold text-[11px] text-ink truncate" title={node.friendlyName || node.name}>
                      {node.friendlyName || node.name}
                    </span>
                    <div className="flex items-center gap-1 flex-shrink-0">
                      {isCustom && (
                        <span className="bg-purple-100 text-purple-700 rounded px-1 text-[8px] font-bold uppercase">
                          Custom
                        </span>
                      )}
                      <span className="bg-paper border border-line rounded px-1 py-0.5 text-[9px] font-mono text-ink-soft">
                        {node.entryCount || 0}×
                      </span>
                    </div>
                  </div>

                  {/* Subtitle / Host */}
                  <div className="text-[10px] text-ink-soft truncate font-mono mb-1">
                    {node.host || node.name}
                  </div>

                  {/* Metrics Footer */}
                  <div className="flex items-center justify-between text-[10px] font-medium pt-1 border-t border-line/60">
                    <div className="flex items-center gap-2">
                      <span className="text-green font-semibold" title="Sent information attributes">
                        ↑ {node.sentInformationCount || 0}
                      </span>
                      <span className="text-blue font-semibold" title="Received information attributes">
                        ↓ {node.receivedInformationCount || 0}
                      </span>
                    </div>

                    {/* Node Action Quick Buttons */}
                    <div className="opacity-0 group-hover:opacity-100 transition-opacity flex items-center gap-1">
                      {onOpenAddConnectionFromNode && (
                        <button
                          onClick={(e) => { e.stopPropagation(); onOpenAddConnectionFromNode(node); }}
                          title="Add link from this API"
                          className="px-1.5 py-0.5 bg-blue text-white rounded text-[9px] font-bold shadow-xs hover:bg-blue/90"
                        >
                          + Link
                        </button>
                      )}
                      {onOpenEditNode && (
                        <button
                          onClick={(e) => { e.stopPropagation(); onOpenEditNode(node); }}
                          title="Edit API"
                          className="px-1.5 py-0.5 bg-paper border border-line rounded text-[9px] font-bold text-ink hover:bg-paper-raised"
                        >
                          ✏️
                        </button>
                      )}
                    </div>
                  </div>
                </div>
              </foreignObject>
            );
          })}
        </g>
      </svg>
    </div>
  );
}


/* ---------------------------------------------------------------------- */
/* FEATURE: Connection & Data Movement Detail Panel (Editable Architecture)*/
/* ---------------------------------------------------------------------- */

function DataFlowInspectorPanel({
  selectedConnection,
  onClearSelectedConnection,
  selectedNode,
  onClearSelectedNode,
  activeTrace,
  onClearTrace,
  onSelectTrace,
  presentationModel,
  onNavigateToEntry,
  showDiagnostics,
  setShowDiagnostics,
  onConfirmConnection,
  onReverseConnection,
  onDeleteConnection,
  onOpenEditConnection,
  onOpenEditNode,
  onDeleteNode,
  onOpenAddNode,
  onOpenAddLink,
  onConfirmAllInferred,
  onOpenAppKnowledgeModal,
  onOpenConflictModal,
  conflicts = [],
}) {
  const [revealedValues, setRevealedValues] = useState(new Set());

  function toggleReveal(relId) {
    setRevealedValues(prev => {
      const next = new Set(prev);
      if (next.has(relId)) next.delete(relId); else next.add(relId);
      return next;
    });
  }

  // Connection detail
  if (selectedConnection) {
    const isConfirmed = selectedConnection.status === 'user-confirmed' || selectedConnection.isUserConfirmed;
    const isCustom = selectedConnection.status === 'user-created';

    return (
      <div className="bg-paper-raised border border-line rounded-xl p-4 shadow-xs space-y-3">
        <div className="flex items-center justify-between flex-wrap gap-2">
          <div className="flex items-center gap-2">
            <span className={`text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full ${
              isConfirmed ? 'bg-green/15 text-green border border-green/30' : isCustom ? 'bg-purple-100 text-purple-700 border border-purple-300' : 'bg-amber/15 text-amber border border-amber/30'
            }`}>
              {isConfirmed ? '✓ Confirmed' : isCustom ? '✏️ User Created' : '⚡ Inferred from HAR'}
            </span>
            <span className="text-[11px] font-semibold bg-paper border border-line px-2 py-0.5 rounded text-ink-soft">
              {selectedConnection.type === 'api_call' ? '📞 API Communication' : '🌊 Data Flow'}
            </span>
          </div>

          <div className="flex items-center gap-1.5">
            {!isConfirmed && onConfirmConnection && (
              <button
                onClick={() => onConfirmConnection(selectedConnection)}
                className="px-2.5 py-1 bg-green text-white rounded-md text-xs font-semibold hover:bg-green/90 transition-colors shadow-xs"
              >
                ✓ Confirm
              </button>
            )}
            {onReverseConnection && (
              <button
                onClick={() => onReverseConnection(selectedConnection)}
                className="px-2 py-1 bg-paper border border-line rounded-md text-xs font-semibold hover:bg-paper-raised text-ink transition-colors"
                title="Reverse Direction"
              >
                ⇄ Reverse
              </button>
            )}
            {onOpenEditConnection && (
              <button
                onClick={() => onOpenEditConnection(selectedConnection)}
                className="px-2 py-1 bg-paper border border-line rounded-md text-xs font-semibold hover:bg-paper-raised text-ink transition-colors"
              >
                ✏️ Edit
              </button>
            )}
            {onDeleteConnection && (
              <button
                onClick={() => onDeleteConnection(selectedConnection)}
                className="px-2 py-1 bg-red-bg border border-red/40 text-red rounded-md text-xs font-semibold hover:bg-red hover:text-white transition-colors"
                title="Unlink Relationship"
              >
                🗑️ Unlink
              </button>
            )}
            <button
              onClick={onClearSelectedConnection}
              className="text-xs text-ink-soft hover:text-ink px-2 py-1 rounded border border-line hover:bg-paper"
            >✕</button>
          </div>
        </div>

        {/* Connection Header */}
        <div className="flex items-center justify-between text-sm font-bold text-ink bg-paper p-3 rounded-lg border border-line">
          <span>{selectedConnection.sourceFriendlyName}</span>
          <span className="text-ink-soft font-mono font-normal mx-2">
            {selectedConnection.type === 'api_call' ? '──[Calls]──▶' : '┈ ┈[Sends]┈ ┈▶'}
          </span>
          <span>{selectedConnection.targetFriendlyName}</span>
        </div>

        {selectedConnection.description && (
          <div className="text-xs text-ink-soft bg-paper p-2.5 rounded-lg border border-line leading-relaxed">
            <span className="font-semibold text-ink">Notes:</span> {selectedConnection.description}
          </div>
        )}

        {/* Attributes carried */}
        <div className="space-y-2">
          <div className="text-xs font-bold uppercase tracking-wider text-ink-soft">
            Carried Information Attributes ({selectedConnection.information ? selectedConnection.information.length : 0})
          </div>

          <div className="space-y-2 max-h-[380px] overflow-y-auto pr-1">
            {(selectedConnection.information || []).map((info, idx) => {
              const firstEv = info.evidence && info.evidence[0];
              const isRevealed = firstEv ? revealedValues.has(firstEv.id) : false;
              const displayVal = firstEv
                ? (isRevealed ? (firstEv.value || '–') : (firstEv.isSensitive ? '••••••••' : (firstEv.value || '–')))
                : (info.sampleValue || '–');

              return (
                <div key={idx} className="bg-paper border border-line rounded-lg p-3 text-xs space-y-2">
                  <div className="flex items-center justify-between gap-1">
                    <span className="font-bold text-ink">{info.attributeName}</span>
                    <span className="text-[10px] bg-paper-raised px-2 py-0.5 rounded font-mono text-ink-soft border border-line">
                      {info.occurrenceCount || 1}× occurrences
                    </span>
                  </div>

                  {/* Value Preview */}
                  <div className="bg-paper-raised border border-line rounded p-2 flex items-center justify-between gap-2">
                    <div className="truncate">
                      <span className="text-[10px] text-ink-soft mr-1">Value:</span>
                      <span className="font-mono text-ink font-semibold">{displayVal}</span>
                    </div>
                    {firstEv && firstEv.isSensitive && (
                      <button
                        onClick={() => toggleReveal(firstEv.id)}
                        className="text-[10px] font-semibold border border-line px-2 py-0.5 rounded hover:bg-paper text-ink-soft flex-shrink-0"
                      >
                        {isRevealed ? '🔒 Mask' : '👁️ Reveal'}
                      </button>
                    )}
                  </div>

                  {/* View HAR entry */}
                  {firstEv && onNavigateToEntry && (
                    <button
                      onClick={() => onNavigateToEntry(firstEv.targetEntryIndex != null ? firstEv.targetEntryIndex : firstEv.sourceEntryIndex)}
                      className="w-full text-[11px] font-semibold border border-line bg-paper-raised rounded-md py-1 px-2 text-center hover:bg-blue-bg hover:border-blue hover:text-blue transition-colors"
                    >
                      🔍 Inspect in Advanced Log
                    </button>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      </div>
    );
  }

  // Node detail
  if (selectedNode) {
    return (
      <div className="bg-paper-raised border border-line rounded-xl p-4 shadow-xs space-y-3 max-h-[60vh] overflow-y-auto">
        <div className="flex items-center justify-between flex-wrap gap-2">
          <div className="flex items-center gap-2">
            <span className="font-bold text-sm text-ink">{selectedNode.friendlyName || selectedNode.name}</span>
            {selectedNode.group && (
              <span className="text-[10px] bg-paper border border-line px-2 py-0.5 rounded-full font-semibold text-ink-soft">
                {selectedNode.group}
              </span>
            )}
          </div>

          <div className="flex items-center gap-1.5">
            {onOpenAddLink && (
              <button
                onClick={() => onOpenAddLink(selectedNode)}
                className="px-2.5 py-1 bg-blue text-white rounded-md text-xs font-semibold hover:bg-blue/90 shadow-xs"
              >
                + Link API
              </button>
            )}
            {onOpenEditNode && (
              <button
                onClick={() => onOpenEditNode(selectedNode)}
                className="px-2 py-1 bg-paper border border-line rounded-md text-xs font-semibold hover:bg-paper-raised text-ink"
              >
                ✏️ Edit
              </button>
            )}
            {onDeleteNode && (
              <button
                onClick={() => onDeleteNode(selectedNode)}
                className="px-2 py-1 bg-red-bg border border-red/40 text-red rounded-md text-xs font-semibold hover:bg-red hover:text-white"
                title="Delete Service"
              >
                🗑️ Delete
              </button>
            )}
            <button onClick={onClearSelectedNode} className="text-xs text-ink-soft hover:text-ink px-1.5 py-0.5 rounded border border-line hover:bg-paper">✕</button>
          </div>
        </div>

        <div className="text-xs text-ink-soft space-y-1 bg-paper p-2.5 rounded-lg border border-line">
          <div><span className="font-semibold text-ink">Host/Base:</span> <span className="font-mono">{selectedNode.host || selectedNode.hostname || selectedNode.name}</span></div>
          {selectedNode.description && <div><span className="font-semibold text-ink">Description:</span> {selectedNode.description}</div>}
        </div>

        {/* Sent attributes */}
        {selectedNode.sentAttributesList && selectedNode.sentAttributesList.length > 0 && (
          <div className="space-y-1.5">
            <div className="text-[10px] font-bold uppercase tracking-wider text-green">
              ↑ Information Sent to Other APIs ({selectedNode.sentAttributesList.length})
            </div>
            <div className="grid grid-cols-2 gap-1.5 max-h-[140px] overflow-y-auto">
              {selectedNode.sentAttributesList.map((attr, i) => (
                <div
                  key={i}
                  onClick={() => onSelectTrace(attr.attributeName)}
                  className="p-1.5 rounded bg-paper border border-line hover:border-green cursor-pointer text-xs font-semibold text-green truncate"
                >• {attr.attributeName}</div>
              ))}
            </div>
          </div>
        )}

        {/* Received attributes */}
        {selectedNode.receivedAttributesList && selectedNode.receivedAttributesList.length > 0 && (
          <div className="space-y-1.5">
            <div className="text-[10px] font-bold uppercase tracking-wider text-blue">
              ↓ Information Received from Other APIs ({selectedNode.receivedAttributesList.length})
            </div>
            <div className="grid grid-cols-2 gap-1.5 max-h-[140px] overflow-y-auto">
              {selectedNode.receivedAttributesList.map((attr, i) => (
                <div
                  key={i}
                  onClick={() => onSelectTrace(attr.attributeName)}
                  className="p-1.5 rounded bg-paper border border-line hover:border-blue cursor-pointer text-xs font-semibold text-blue truncate"
                >• {attr.attributeName}</div>
              ))}
            </div>
          </div>
        )}
      </div>
    );
  }

  // Active trace banner
  if (activeTrace) {
    const formattedTrace = HarAnalyzer.formatAttributeName(activeTrace);
    return (
      <div className="bg-paper-raised border border-line rounded-xl p-4 shadow-xs space-y-3">
        <div className="flex items-center justify-between">
          <span className="font-bold text-xs text-ink uppercase tracking-wider">Active Trace Mode</span>
          <button onClick={onClearTrace} className="text-xs text-ink-soft hover:text-ink px-1.5 py-0.5 rounded border border-line hover:bg-paper">✕ Clear</button>
        </div>
        <div className="text-xs text-ink-soft p-2 bg-amber-bg/50 border border-amber/30 rounded-lg font-semibold">
          Highlighting all connections carrying <strong className="text-ink">{formattedTrace}</strong>.
        </div>
      </div>
    );
  }

  // Default Overview
  return (
    <div className="bg-paper-raised border border-line rounded-xl p-4 shadow-xs space-y-3">
      <div className="flex items-center justify-between flex-wrap gap-2">
        <div className="flex items-center gap-2 flex-wrap">
          <span className="font-bold text-xs uppercase tracking-wider text-ink">Architecture & Data Flow Summary</span>
          {onOpenAddNode && (
            <button
              onClick={onOpenAddNode}
              className="px-2.5 py-1 bg-paper border border-line rounded-lg text-xs font-semibold hover:bg-paper-raised text-ink flex items-center gap-1 shadow-xs"
            >
              ＋ Add API Node
            </button>
          )}
          {onOpenAddLink && (
            <button
              onClick={onOpenAddLink}
              className="px-2.5 py-1 bg-paper border border-line rounded-lg text-xs font-semibold hover:bg-paper-raised text-ink flex items-center gap-1 shadow-xs"
            >
              ＋ Add Link
            </button>
          )}
          {onConfirmAllInferred && (
            <button
              onClick={onConfirmAllInferred}
              className="px-2.5 py-1 bg-green/10 border border-green/40 text-green rounded-lg text-xs font-semibold hover:bg-green hover:text-white transition-colors flex items-center gap-1"
              title="Confirm all inferred relationships"
            >
              ✓ Confirm All
            </button>
          )}
        </div>

        <div className="flex items-center gap-1.5">
          {conflicts && conflicts.length > 0 && onOpenConflictModal && (
            <button
              onClick={onOpenConflictModal}
              className="px-2.5 py-1 rounded bg-amber-bg border border-amber/40 text-amber font-bold text-xs hover:bg-amber hover:text-white transition-colors"
            >
              ⚠️ {conflicts.length} Conflicts
            </button>
          )}
          <button onClick={() => setShowDiagnostics(v => !v)} className="text-[10px] text-ink-soft hover:text-ink font-mono px-2 py-1 rounded border border-line hover:bg-paper">
            {showDiagnostics ? 'Hide Diagnostics' : '⚙ Diagnostics'}
          </button>
        </div>
      </div>

      {showDiagnostics && (
        <div className="p-2.5 bg-paper border border-line rounded-lg font-mono text-[11px] space-y-1">
          <div className="text-[10px] font-bold uppercase tracking-wider text-ink-soft mb-1">Developer Diagnostics:</div>
          <div>Total Requests Parsed: <strong>{presentationModel.diagnostics?.totalEntries || 0}</strong></div>
          <div>Valid URL Requests: <strong>{presentationModel.diagnostics?.validUrlEntries || 0}</strong></div>
          <div>Unique Hosts Detected: <strong>{presentationModel.diagnostics?.uniqueHosts || 0}</strong></div>
          <div>Requests with JSON Body: <strong>{presentationModel.diagnostics?.requestsWithJsonBody || 0}</strong></div>
          <div>Responses with JSON Body: <strong>{presentationModel.diagnostics?.responsesWithJsonBody || 0}</strong></div>
          <div>Extracted Response Fields: <strong>{presentationModel.diagnostics?.extractedResponseCount || 0}</strong></div>
          <div>Extracted Request Fields: <strong>{presentationModel.diagnostics?.extractedRequestCount || 0}</strong></div>
          <div>Candidate Value Matches: <strong>{presentationModel.diagnostics?.candidateMatchesCount || 0}</strong></div>
        </div>
      )}

      <div className="grid grid-cols-3 gap-2">
        <div className="bg-paper border border-line rounded-lg p-2.5 text-center">
          <div className="text-[10px] uppercase font-bold text-ink-soft">APIs / Services</div>
          <div className="text-lg font-bold font-mono text-ink">{presentationModel.apiCount || 0}</div>
        </div>
        <div className="bg-paper border border-line rounded-lg p-2.5 text-center">
          <div className="text-[10px] uppercase font-bold text-ink-soft">Connections</div>
          <div className="text-lg font-bold font-mono text-blue">{presentationModel.connectionCount || 0}</div>
        </div>
        <div className="bg-paper border border-line rounded-lg p-2.5 text-center">
          <div className="text-[10px] uppercase font-bold text-ink-soft">Data Attributes</div>
          <div className="text-lg font-bold font-mono text-green">{presentationModel.distinctInformationCount || 0}</div>
        </div>
      </div>

      {presentationModel.flowStories && presentationModel.flowStories.length > 0 && (
        <div className="bg-paper border border-line rounded-lg p-3 space-y-1.5">
          <div className="font-bold text-xs text-ink">📖 How information flows</div>
          <div className="space-y-1 text-xs text-ink-soft leading-relaxed">
            {presentationModel.flowStories.slice(0, 5).map((story, i) => (
              <div key={i} className="flex items-start gap-1.5">
                <span className="text-blue mt-0.5">•</span>
                <span dangerouslySetInnerHTML={{ __html: story.replace(/\*\*(.*?)\*\*/g, '<strong class="text-ink">$1</strong>') }} />
              </div>
            ))}
            {presentationModel.flowStories.length > 5 && (
              <div className="text-[11px] text-ink-soft italic">+{presentationModel.flowStories.length - 5} more...</div>
            )}
          </div>
        </div>
      )}

      <div className="p-2 bg-paper border border-line rounded-lg text-[11px] text-ink-soft">
        <span className="font-bold text-ink">💡 Tip: </span>
        Click and drag any API node to reposition it. Click any node or link arrow to edit, reverse direction, or confirm relationships.
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/* FEATURE: How Data Moves Between APIs (Main View with Editable Knowledge)*/
/* ---------------------------------------------------------------------- */

function DataFlowView({
  rawEntries,
  dataFlowModel,
  groupMode,
  setGroupMode,
  searchQuery,
  setSearchQuery,
  filterApi,
  setFilterApi,
  showTechnical,
  setShowTechnical,
  onNavigateToEntry,
}) {
  const [selectedConnection, setSelectedConnection] = useState(null);
  const [selectedNodeId, setSelectedNodeId] = useState(null);
  const [activeTrace, setActiveTrace] = useState(null);
  const [expandedNodes, setExpandedNodes] = useState(new Set());
  const [showDiagnostics, setShowDiagnostics] = useState(false);

  // Filter and view toggles
  const [showApiCalls, setShowApiCalls] = useState(true);
  const [showDataFlows, setShowDataFlows] = useState(true);
  const [statusFilter, setStatusFilter] = useState('all'); // 'all' | 'confirmed' | 'inferred'

  // Modals state
  const [nodeModalOpen, setNodeModalOpen] = useState(false);
  const [editingNode, setEditingNode] = useState(null);

  const [linkModalOpen, setLinkModalOpen] = useState(false);
  const [editingLink, setEditingLink] = useState(null);
  const [prefilledSourceNode, setPrefilledSourceNode] = useState(null);

  const [appKnowledgeModalOpen, setAppKnowledgeModalOpen] = useState(false);
  const [conflictModalOpen, setConflictModalOpen] = useState(false);

  // Toast notification state
  const [toastMessage, setToastMessage] = useState(null);

  function showToast(msg) {
    setToastMessage(msg);
    setTimeout(() => {
      setToastMessage(prev => (prev === msg ? null : prev));
    }, 3200);
  }

  // Active App Knowledge state
  const [appKnowledge, setAppKnowledge] = useState(() => {
    const saved = localStorage.getItem('har_app_knowledge_active');
    if (saved) {
      const imported = HarAnalyzer.importAppKnowledgeFromJson(saved);
      if (imported) return imported;
    }
    return HarAnalyzer.createAppKnowledge('default_app', 'My Application', dataFlowModel);
  });

  // Automatically sync/merge newly uploaded HAR with active App Knowledge
  const mergedArchitectureModel = useMemo(() => {
    if (!dataFlowModel) return null;
    return HarAnalyzer.mergeHarWithAppKnowledge(dataFlowModel, appKnowledge);
  }, [dataFlowModel, appKnowledge]);

  // Persist App Knowledge to localStorage when updated
  useEffect(() => {
    if (appKnowledge) {
      localStorage.setItem('har_app_knowledge_active', HarAnalyzer.exportAppKnowledgeToJson(appKnowledge));
    }
  }, [appKnowledge]);

  // Build presentation model from merged architecture
  const presentationModel = useMemo(() => {
    if (!mergedArchitectureModel) {
      return { apiCount: 0, connectionCount: 0, distinctInformationCount: 0, totalRawObservations: 0, apiNodes: [], apiConnections: [], flowStories: [], diagnostics: {} };
    }
    return HarAnalyzer.buildPresentationModel(mergedArchitectureModel, {
      hideTechnicalData: !showTechnical,
      filterApi,
      dataTypeFilter: showTechnical ? 'all' : 'business',
      searchQuery,
      showApiCalls,
      showDataFlows,
      statusFilter,
    });
  }, [mergedArchitectureModel, showTechnical, filterApi, searchQuery, showApiCalls, showDataFlows, statusFilter]);

  // Distinct API options for filtering
  const apiOptions = useMemo(() => {
    if (!mergedArchitectureModel || !mergedArchitectureModel.services) return [];
    const seen = new Map();
    mergedArchitectureModel.services.forEach(s => {
      const fname = s.friendlyName || HarAnalyzer.formatFriendlyName(s.name || s.host);
      if (!seen.has(s.id)) seen.set(s.id, fname);
    });
    return [...seen.entries()].sort((a, b) => a[1].localeCompare(b[1]));
  }, [mergedArchitectureModel]);

  const selectedNode = useMemo(() => {
    if (!selectedNodeId || !presentationModel.apiNodes) return null;
    return presentationModel.apiNodes.find(n => n.id === selectedNodeId) || null;
  }, [selectedNodeId, presentationModel]);

  /* ---- Edit & Knowledge Handlers ---- */
  function handleUpdateNodeLayout(nodeId, pos) {
    setAppKnowledge(prev => {
      const nextLayout = { ...(prev.layout || {}), [nodeId]: pos };
      return {
        ...prev,
        updatedAt: new Date().toISOString(),
        layout: nextLayout
      };
    });
  }

  function handleResetLayout() {
    setAppKnowledge(prev => ({
      ...prev,
      updatedAt: new Date().toISOString(),
      layout: {}
    }));
  }

  function handleConfirmConnection(conn) {
    setAppKnowledge(prev => {
      const existingRels = [...(prev.relationships || [])];
      const matchIdx = existingRels.findIndex(r => r.sourceServiceId === conn.sourceServiceId && r.targetServiceId === conn.targetServiceId);

      if (matchIdx !== -1) {
        existingRels[matchIdx] = {
          ...existingRels[matchIdx],
          status: 'user-confirmed',
          userModified: true
        };
      } else {
        existingRels.push({
          id: `user_rel_${existingRels.length + 1}`,
          sourceServiceId: conn.sourceServiceId,
          targetServiceId: conn.targetServiceId,
          sourceServiceName: conn.sourceServiceName,
          targetServiceName: conn.targetServiceName,
          type: conn.type || 'data_flow',
          status: 'user-confirmed',
          attributeNames: conn.attributeNames || [],
          information: conn.information || [],
          userModified: true,
          isDeleted: false
        });
      }

      return {
        ...prev,
        updatedAt: new Date().toISOString(),
        relationships: existingRels
      };
    });
    showToast('✓ Relationship confirmed into App Knowledge!');
  }

  function handleConfirmAllInferred() {
    setAppKnowledge(prev => {
      const rels = (mergedArchitectureModel?.relationships || []).map((r, i) => ({
        id: r.id || `rel_${i + 1}`,
        sourceServiceId: r.sourceServiceId,
        targetServiceId: r.targetServiceId,
        sourceServiceName: r.sourceServiceName,
        targetServiceName: r.targetServiceName,
        type: r.type || 'data_flow',
        status: 'user-confirmed',
        attributeNames: r.attributeNames || [],
        information: r.information || [],
        userModified: true,
        isDeleted: false
      }));

      return {
        ...prev,
        updatedAt: new Date().toISOString(),
        relationships: rels
      };
    });
    showToast('✓ All inferred relationships confirmed into App Knowledge!');
  }

  function handleReverseConnection(conn) {
    setAppKnowledge(prev => {
      const filteredRels = (prev.relationships || []).filter(r => !(r.sourceServiceId === conn.sourceServiceId && r.targetServiceId === conn.targetServiceId));
      filteredRels.push({
        id: `rev_rel_${filteredRels.length + 1}`,
        sourceServiceId: conn.targetServiceId,
        targetServiceId: conn.sourceServiceId,
        sourceServiceName: conn.targetServiceName,
        targetServiceName: conn.sourceServiceName,
        type: conn.type || 'data_flow',
        status: 'user-confirmed',
        attributeNames: conn.attributeNames || [],
        information: conn.information || [],
        userModified: true,
        isDeleted: false
      });

      return {
        ...prev,
        updatedAt: new Date().toISOString(),
        relationships: filteredRels
      };
    });
    setSelectedConnection(null);
  }

  function handleDeleteConnection(conn) {
    setAppKnowledge(prev => {
      const filteredRels = (prev.relationships || []).filter(r => !(r.sourceServiceId === conn.sourceServiceId && r.targetServiceId === conn.targetServiceId));
      const unlinked = [...(prev.unlinkedPairs || [])];
      unlinked.push({ sourceServiceId: conn.sourceServiceId, targetServiceId: conn.targetServiceId });

      return {
        ...prev,
        updatedAt: new Date().toISOString(),
        relationships: filteredRels,
        unlinkedPairs: unlinked
      };
    });
    setSelectedConnection(null);
  }

  function handleSaveNode(nodeData) {
    setAppKnowledge(prev => {
      const services = [...(prev.services || [])];
      const matchIdx = services.findIndex(s => s.id === nodeData.id);
      if (matchIdx !== -1) {
        services[matchIdx] = { ...services[matchIdx], ...nodeData };
      } else {
        services.push({
          ...nodeData,
          isCustom: true,
          isDeleted: false
        });
      }
      return { ...prev, updatedAt: new Date().toISOString(), services };
    });
    setNodeModalOpen(false);
    setEditingNode(null);
  }

  function handleDeleteNode(node) {
    if (!confirm(`Are you sure you want to delete ${node.friendlyName || node.name} and all its connections?`)) return;
    setAppKnowledge(prev => {
      const services = (prev.services || []).map(s => s.id === node.id ? { ...s, isDeleted: true } : s);
      const rels = (prev.relationships || []).filter(r => r.sourceServiceId !== node.id && r.targetServiceId !== node.id);
      return { ...prev, updatedAt: new Date().toISOString(), services, relationships: rels };
    });
    setSelectedNodeId(null);
  }

  function handleSaveLink(linkData) {
    setAppKnowledge(prev => {
      const rels = [...(prev.relationships || [])];
      const matchIdx = rels.findIndex(r => r.sourceServiceId === linkData.sourceServiceId && r.targetServiceId === linkData.targetServiceId);
      if (matchIdx !== -1) {
        rels[matchIdx] = { ...rels[matchIdx], ...linkData, userModified: true };
      } else {
        rels.push({
          ...linkData,
          id: `custom_rel_${rels.length + 1}`,
          userModified: true,
          isDeleted: false
        });
      }
      return { ...prev, updatedAt: new Date().toISOString(), relationships: rels };
    });
    setLinkModalOpen(false);
    setEditingLink(null);
    setPrefilledSourceNode(null);
  }

  

  const conflicts = mergedArchitectureModel?.conflicts || [];

  return (
    <div className="p-3 space-y-3">
      {/* Header & Controls */}
      <div className="bg-paper-raised border border-line rounded-xl p-3 shadow-xs space-y-2.5">
        <div className="flex items-center justify-between gap-3 flex-wrap">
          <div>
            <h2 className="text-base font-bold text-ink flex items-center gap-2">
              API Communication & Data Flow Architecture
              <span className="text-[10px] font-bold bg-red-500 text-white px-1.5 py-0.5 rounded-full uppercase tracking-wider">BETA</span>
            </h2>
            <p className="text-xs text-ink-soft mt-0.5">
              Interactive, editable architecture graph of observed API communications and data propagation.
            </p>
          </div>

          <div className="flex items-center gap-2 flex-wrap">
            {/* Grouping Mode Toggle */}
            <div className="flex bg-paper border border-line rounded-lg p-0.5 text-xs font-semibold">
              <button
                onClick={() => setGroupMode('service')}
                className={`px-2.5 py-1 rounded-md transition-colors ${groupMode === 'service' ? 'bg-ink text-paper' : 'text-ink-soft hover:text-ink'}`}
              >🏢 By Service</button>
              <button
                onClick={() => setGroupMode('endpoint')}
                className={`px-2.5 py-1 rounded-md transition-colors ${groupMode === 'endpoint' ? 'bg-ink text-paper' : 'text-ink-soft hover:text-ink'}`}
              >🔗 By Endpoint</button>
            </div>

            <button
              onClick={() => setAppKnowledgeModalOpen(true)}
              className="px-2.5 py-1 bg-blue text-white rounded-lg text-xs font-semibold hover:bg-blue/90 flex items-center gap-1 shadow-xs"
            >
              💾 App Knowledge
            </button>
          </div>
        </div>

        {/* Filters & Toggles */}
        <div className="flex items-center gap-3 pt-2 border-t border-line flex-wrap text-xs font-medium text-ink-soft">
          {/* Search Box */}
          <div className="flex-1 min-w-[180px] max-w-[240px]">
            <input
              value={searchQuery}
              onChange={e => setSearchQuery(e.target.value)}
              placeholder="🔎 Search data or APIs..."
              className="w-full border border-line rounded-lg px-3 py-1.5 text-xs bg-paper text-ink focus:outline-none focus:border-blue"
            />
          </div>

          {/* Filter by API */}
          <select
            value={filterApi}
            onChange={e => setFilterApi(e.target.value)}
            className="border border-line rounded-lg px-2.5 py-1.5 text-xs bg-paper text-ink font-semibold focus:outline-none focus:border-blue"
          >
            <option value="all">All APIs / Services</option>
            {apiOptions.map(([id, name]) => (
              <option key={id} value={id}>{name}</option>
            ))}
          </select>

          {/* Status Filter */}
          <select
            value={statusFilter}
            onChange={e => setStatusFilter(e.target.value)}
            className="border border-line rounded-lg px-2.5 py-1.5 text-xs bg-paper text-ink font-semibold focus:outline-none focus:border-blue"
          >
            <option value="all">All Statuses</option>
            <option value="confirmed">✓ Confirmed Only</option>
            <option value="inferred">⚡ Inferred Only</option>
          </select>

          {/* Link Type Toggles */}
          <div className="flex items-center gap-3 font-semibold text-ink">
            <label className="flex items-center gap-1.5 cursor-pointer text-[11px]">
              <input
                type="checkbox"
                checked={showApiCalls}
                onChange={e => setShowApiCalls(e.target.checked)}
                className="rounded text-blue"
              />
              <span>API Calls</span>
            </label>
            <label className="flex items-center gap-1.5 cursor-pointer text-[11px]">
              <input
                type="checkbox"
                checked={showDataFlows}
                onChange={e => setShowDataFlows(e.target.checked)}
                className="rounded text-blue"
              />
              <span>Data Flows</span>
            </label>
            <label className="flex items-center gap-1.5 cursor-pointer text-[11px]">
              <input
                type="checkbox"
                checked={showTechnical}
                onChange={e => setShowTechnical(e.target.checked)}
                className="rounded text-blue"
              />
              <span>Technical Data</span>
            </label>
          </div>

          {/* Conflict Badge */}
          {conflicts.length > 0 && (
            <button
              onClick={() => setConflictModalOpen(true)}
              className="px-2 py-0.5 rounded-full bg-amber-bg border border-amber text-amber font-bold text-[11px] animate-pulse"
            >
              ⚠️ {conflicts.length} Conflict{conflicts.length > 1 ? 's' : ''} Detected
            </button>
          )}

          {(searchQuery || filterApi !== 'all' || !showApiCalls || !showDataFlows || showTechnical || statusFilter !== 'all' || activeTrace) && (
            <button
              onClick={() => {
                setSearchQuery('');
                setFilterApi('all');
                setShowApiCalls(true);
                setShowDataFlows(true);
                setShowTechnical(false);
                setStatusFilter('all');
                setActiveTrace(null);
                setSelectedConnection(null);
                setSelectedNodeId(null);
              }}
              className="text-blue hover:underline ml-auto text-xs font-semibold"
            >Reset Filters</button>
          )}
        </div>

        {/* Required Disclaimer Note */}
        <div className="text-[11px] text-ink-soft bg-paper border border-line rounded-lg px-3 py-1.5 leading-relaxed">
          <strong className="text-ink font-semibold">Note:</strong> API communications and data flows are initially inferred from HAR evidence and may be incomplete or inaccurate. Review and modify inferred relationships to reflect your application's actual behavior.
        </div>
      </div>

      {/* Graph Canvas */}
      <DataFlowGraphCanvas
        apiNodes={presentationModel.apiNodes}
        apiConnections={presentationModel.apiConnections}
        selectedConnection={selectedConnection}
        onSelectConnection={(conn) => { setSelectedConnection(conn); setSelectedNodeId(null); }}
        selectedNodeId={selectedNodeId}
        onSelectNode={(nodeId) => { setSelectedNodeId(nodeId); setSelectedConnection(null); }}
        activeTrace={activeTrace}
        onSelectTrace={(attr) => { setActiveTrace(attr); setSelectedConnection(null); }}
        onOpenDiagnostics={() => setShowDiagnostics(true)}
        onUpdateNodeLayout={handleUpdateNodeLayout}
        onQuickConfirmConnection={handleConfirmConnection}
        onReverseConnection={handleReverseConnection}
        onDeleteConnection={handleDeleteConnection}
        onOpenEditConnection={(conn) => { setEditingLink(conn); setLinkModalOpen(true); }}
        onOpenAddConnectionFromNode={(node) => { setEditingLink(null); setPrefilledSourceNode(node); setLinkModalOpen(true); }}
        onOpenEditNode={(node) => { setEditingNode(node); setNodeModalOpen(true); }}
        onDeleteNode={handleDeleteNode}
        appKnowledge={appKnowledge}
        onResetLayout={handleResetLayout}
        showApiCalls={showApiCalls}
        showDataFlows={showDataFlows}
      />

      {/* Inspector Panel */}
      <DataFlowInspectorPanel
        selectedConnection={selectedConnection}
        onClearSelectedConnection={() => setSelectedConnection(null)}
        selectedNode={selectedNode}
        onClearSelectedNode={() => setSelectedNodeId(null)}
        activeTrace={activeTrace}
        onClearTrace={() => setActiveTrace(null)}
        onSelectTrace={(attr) => setActiveTrace(attr)}
        presentationModel={presentationModel}
        onNavigateToEntry={onNavigateToEntry}
        showDiagnostics={showDiagnostics}
        setShowDiagnostics={setShowDiagnostics}
        onConfirmConnection={handleConfirmConnection}
        onReverseConnection={handleReverseConnection}
        onDeleteConnection={handleDeleteConnection}
        onOpenEditConnection={(conn) => { setEditingLink(conn); setLinkModalOpen(true); }}
        onOpenAddNode={() => { setEditingNode(null); setNodeModalOpen(true); }}
        onOpenAddLink={(node) => { setEditingLink(null); setPrefilledSourceNode(node || null); setLinkModalOpen(true); }}
        onConfirmAllInferred={handleConfirmAllInferred}
        onOpenEditNode={(node) => { setEditingNode(node); setNodeModalOpen(true); }}
        onDeleteNode={handleDeleteNode}
        onOpenAppKnowledgeModal={() => setAppKnowledgeModalOpen(true)}
        onOpenConflictModal={() => setConflictModalOpen(true)}
        conflicts={conflicts}
      />

      {/* Floating Toast Notification */}
      {toastMessage && (
        <div className="fixed bottom-6 right-6 z-50 flex items-center gap-2 bg-ink text-paper px-4 py-2.5 rounded-xl shadow-xl border border-line/20 text-xs font-semibold transition-all">
          <span>{toastMessage}</span>
          <button onClick={() => setToastMessage(null)} className="ml-2 text-ink-soft hover:text-paper font-mono">✕</button>
        </div>
      )}

      {/* Dialog: Add/Edit API Node */}
      {nodeModalOpen && (
        <AddEditNodeModal
          node={editingNode}
          onSave={handleSaveNode}
          onClose={() => { setNodeModalOpen(false); setEditingNode(null); }}
        />
      )}

      {/* Dialog: Add/Edit Link */}
      {linkModalOpen && (
        <AddEditLinkModal
          link={editingLink}
          prefilledSource={prefilledSourceNode}
          services={presentationModel.apiNodes}
          onSave={handleSaveLink}
          onClose={() => { setLinkModalOpen(false); setEditingLink(null); setPrefilledSourceNode(null); }}
        />
      )}

      {/* Dialog: App Knowledge Manager */}
      {appKnowledgeModalOpen && (
        <AppKnowledgeModal
          knowledge={appKnowledge}
          onUpdateKnowledge={setAppKnowledge}
          onResetToInference={() => {
            if (confirm('Reset architecture to raw HAR inference? User-confirmed edits will be cleared.')) {
              setAppKnowledge(HarAnalyzer.createAppKnowledge('default_app', 'My Application', dataFlowModel));
            }
          }}
          onClose={() => setAppKnowledgeModalOpen(false)}
        />
      )}

      {/* Dialog: Conflict Review */}
      {conflictModalOpen && (
        <ConflictReviewModal
          conflicts={conflicts}
          onResolve={(conflictId, action) => {
            // Remove conflict or accept
            setConflictModalOpen(false);
          }}
          onClose={() => setConflictModalOpen(false)}
        />
      )}
    </div>
  );
}

/* FEATURE: Architecture Modals & Dialogs                                 */
